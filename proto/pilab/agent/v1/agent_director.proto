// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package agent_director;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v1;agentv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AgentDirectorService {
  rpc ReportHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportHypervisorStatus(HypervisorStatus) returns (google.protobuf.Empty);
  rpc ReportVMStatus(VMStatusUpdate) returns (google.protobuf.Empty);
  rpc ReportDiskStatus(DiskStatusUpdate) returns (google.protobuf.Empty);
  rpc ReportNetworkInterfaceStatus(NetworkInterfaceStatusUpdate) returns (google.protobuf.Empty);
  rpc ReportHardwareStatus(HardwareStatusUpdate) returns (google.protobuf.Empty);
  rpc ReportVMMetrics(VMMetrics) returns (google.protobuf.Empty);
  rpc ReportHypervisorResourceUsage(HypervisorResourceUsage) returns (google.protobuf.Empty);
  rpc ReportEvent(Event) returns (google.protobuf.Empty);
  rpc StreamLogs(stream LogRequest) returns (stream LogResponse);
  rpc ReportTaskProgress(TaskProgress) returns (google.protobuf.Empty);
  rpc ReportWorkflowState(WorkflowState) returns (google.protobuf.Empty);
  rpc ReportAgentUpdateStatus(AgentUpdateStatus) returns (google.protobuf.Empty);
  rpc AcknowledgeAgentConfiguration(AgentConfiguration) returns (google.protobuf.Empty);
}

enum VMState {
  NOSTATE = 0;
  RUNNING = 1;
  BLOCKED = 2;
  PAUSED = 3;
  SHUTDOWN = 4;
  SHUTOFF = 5;
  CRASHED = 6;
  SUSPENDED = 7;
}

message HardwareStatusUpdate {
  string device_uuid = 1;
  string vm_uuid = 2;
  string status = 3;
  string error_message = 4;
}

message DiskStatusUpdate {
  string disk_uuid = 1;
  string vm_uuid = 2;
  string status = 3;
  string error_message = 4;
}

message NetworkInterfaceStatusUpdate {
  string interface_uuid = 1;
  string vm_uuid = 2;
  string status = 3;
  string mac_address = 4;
  string error_message = 5;
}

message VMStatusUpdate {
  string vm_uuid = 1;
  VMState state = 2;
  string error_message = 3;
}

message HeartbeatRequest {
  string agent_id = 1;
  string agent_version = 2;
}

message HeartbeatResponse {
  string message = 1;
}

message HypervisorStatus {
  enum HealthStatus {
    OK = 0;
    WARNING = 1;
    ERROR = 2;
  }
  float cpu_usage = 1;
  int64 memory_total_mb = 2;
  int64 memory_used_mb = 3;
  int64 storage_total_mb = 4;
  int64 storage_used_mb = 5;
  repeated NetworkInterfaceStatus network_interfaces = 6;
  HealthStatus health_status = 7;
  string health_details = 8;
  int32 running_vms = 9;
  int32 stopped_vms = 10;
  string hypervisor_version = 11;
}

message NetworkInterfaceStatus {
  string name = 1;
  bool up = 2;
  float bandwidth_mbps = 3;
}

message VMMetrics {
  string vm_uuid = 1;
  repeated CPUUsage cpu_usages = 2;
  float memory_usage_percent = 3;
  int64 memory_usage_mb = 4;
  DiskIOMetrics disk_io = 5;
  NetworkIOMetrics network_io = 6;
  google.protobuf.Timestamp timestamp = 7;

  message CPUUsage {
    uint32 vcpu_id = 1;
    float usage_percent = 2;
  }

  message DiskIOMetrics {
    int64 read_bytes_per_second = 1;
    int64 write_bytes_per_second = 2;
    int64 read_iops = 3;
    int64 write_iops = 4;
  }

  message NetworkIOMetrics {
    int64 receive_bytes_per_second = 1;
    int64 transmit_bytes_per_second = 2;
  }
}

message HypervisorResourceUsage {
  float cpu_usage_percent = 1;
  int64 memory_usage_mb = 2;
  int64 disk_usage_mb = 3;
  NetworkIOMetrics network_io = 4;
  google.protobuf.Timestamp timestamp = 5;

  message NetworkIOMetrics {
    int64 receive_bytes_per_second = 1;
    int64 transmit_bytes_per_second = 2;
  }
}

message Event {
  google.protobuf.Timestamp timestamp = 1;
  string vm_uuid = 2;
  enum Severity {
    INFO = 0;
    WARNING = 1;
    ERROR = 2;
  }
  Severity severity = 3;
  string message = 4;
  map<string, string> details = 5;
}

message LogRequest {
  string source = 1;
  enum LogLevel {
    DEBUG = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
  }
  LogLevel log_level = 2;
  string filter = 3;
}

message LogResponse {
  google.protobuf.Timestamp timestamp = 1;
  string source = 2;
  string message = 3;
}

message TaskProgress {
  string task_id = 1;
  enum TaskStatus {
    PENDING = 0;
    RUNNING = 1;
    COMPLETED = 2;
    FAILED = 3;
  }
  TaskStatus status = 2;
  float progress_percent = 3;
  string output = 4;
}

message WorkflowState {
  string workflow_id = 1;
  string step_id = 2;
  enum StepState {
    PENDING = 0;
    RUNNING = 1;
    SUCCEEDED = 2;
    FAILED = 3;
  }
  StepState state = 3;
  map<string, string> output_data = 4;
}

message AgentUpdateStatus {
  enum UpdateStatus {
    UNKNOWN = 0;
    DOWNLOADING = 1;
    INSTALLING = 2;
    SUCCESSFUL = 3;
    FAILED = 4;
  }
  UpdateStatus status = 1;
  string message = 2;
}

message AgentConfiguration {
  string config_data = 1;
}