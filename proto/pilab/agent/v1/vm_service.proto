// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package pilab.cloud.agent.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v1;agentv1";

import "pilab/agent/v1/stream.proto";
import "pilab/agent/v1/error.proto";

service VirtualMachineService {
  rpc Define(VmDefineRequest) returns (VmDefineResponse);
  rpc GetDefinition(VmGetDefinitionRequest) returns (VmGetDefinitionResponse);
  rpc Control(VmControlRequest) returns (VmControlResponse);
  rpc Status(VmStatusRequest) returns (VmStatusResponse);
  rpc GuestInfo(VmGuestInfoRequest) returns (VmGuestInfoResponse);
  rpc AttachISO(VmAttachISORequest) returns (VmAttachISOResponse);
  rpc DetachISO(VmDetachISORequest) returns (VmDetachISOResponse);
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc WakeOnLAN(WakeOnLANRequest) returns (WakeOnLANResponse);
  rpc CreatePowerSchedule(CreatePowerScheduleRequest) returns (CreatePowerScheduleResponse);
  rpc ListPowerSchedules(ListPowerSchedulesRequest) returns (ListPowerSchedulesResponse);
  rpc UpdatePowerSchedule(UpdatePowerScheduleRequest) returns (UpdatePowerScheduleResponse);
  rpc DeletePowerSchedule(DeletePowerScheduleRequest) returns (DeletePowerScheduleResponse);
}

enum ControlCommand {
  CONTROL_COMMAND_UNKNOWN = 0;
  CONTROL_COMMAND_STOP = 1;
  CONTROL_COMMAND_KILL = 2;
  CONTROL_COMMAND_SUSPEND = 3;
  CONTROL_COMMAND_RESUME = 4;
  CONTROL_COMMAND_REBOOT = 5;
  CONTROL_COMMAND_SHUTDOWN = 6;
  CONTROL_COMMAND_RESET = 7;
}

message VmDefineRequest {
  string vm_definition = 1;
  optional bool boon_on_create = 2;
}

message VmDefineResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
  string vm_uuid = 4;
}

message VmGetDefinitionRequest {
  string vm = 1;
  bool force_fetch = 2;
}

message VmGetDefinitionResponse {
  string vm_definition = 1;
}

message VmControlRequest {
  string vm = 1;
  ControlCommand command = 2;
}

message VmControlResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}

message VmAttachISORequest {
  string vm = 1;
  string iso_name = 2;
}

message VmAttachISOResponse {}

message VmDetachISORequest {
  string vm = 1;
  string iso_name = 2;
}

message VmDetachISOResponse {}

message VmStatusRequest {
  string vm = 1;
}

message VmStatusResponse {
  string status = 1;
}

message Disk {
  string path = 1;
  string device = 2;
  string bus = 3;
  string format = 4;
  int32 read_iops_sec = 5;
  int32 write_iops_sec = 6;
  int64 read_bytes_sec = 7;
  int64 write_bytes_sec = 8;
  int32 total_iops_sec = 9;
  int64 total_bytes_sec = 10;
  int32 burst_iops_sec = 11;
  int64 burst_bytes_sec = 12;
}

message Firmware {
  string type = 1;
  bool secure_boot = 2;
  bool enrolled_keys = 3;
}

message TPM {
  string model = 1;
  string backend = 2;
  string device = 3;
}

message USBController {
  string model = 1;
  bool host_device_passthrough = 2;
  repeated string passthrough_devices = 3;
}

message USBDevice {
  string vendor_id = 1;
  string product_id = 2;
  string host_bus = 3;
  string host_device = 4;
}

message VMNetworkInterface {
  string type = 1;
  string source = 2;
  string model = 3;
  string mac = 4;
  repeated string bond_interfaces = 5;
  string bond_mode = 6;
  bool lacp_enabled = 7;
  bool wake_on_lan = 8;
}

message VirtualMachine {
  string uuid = 1;
  string name = 2;
  int32 memory_mb = 3;
  int32 vcpus = 4;
  repeated Disk disks = 5;
  Firmware firmware = 6;
  TPM tpm = 7;
  repeated VMNetworkInterface network_interfaces = 8;
  repeated USBController usb_controllers = 9;
  repeated USBDevice usb_devices = 10;
}

message CreateVMRequest {
  VirtualMachine vm_config = 1;
  optional bool boot_on_create = 2;
}

message CreateVMResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
  string vm_uuid = 4;
}

message StartVMRequest {
  string vm_uuid = 1;
}

message StartVMResponse {}

message WakeOnLANRequest {
  string vm_uuid = 1;
  string mac_address = 2;
}

message WakeOnLANResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}

message UpdateVMRequest {
  string vm_uuid = 1;
  VirtualMachine updated_vm_config = 2;
}

message UpdateVMResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}

message VmGuestInfoRequest {
  string vm = 1;
}

message VmGuestOS {
  string id = 1;
  string name = 2;
  string pretty_name = 3;
  string version = 4;
  string version_id = 5;
  string machine = 6;
  string kernel_release = 7;
  string kernel_version = 8;
}

message VmGuestInterfaceAddress {
  string type = 1;
  string address = 2;
  uint32 prefix = 3;
}

message VmGuestNetworkInterface {
  string name = 1;
  string hwaddr = 2;
  repeated VmGuestInterfaceAddress addresses = 3;
}

message VmGuestInfoResponse {
  string hostname = 1;
  VmGuestOS os = 2;
  repeated VmGuestNetworkInterface interfaces = 3;
}

enum PowerAction {
  POWER_ACTION_UNKNOWN = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_REBOOT = 3;
}

enum RecurrenceType {
  RECURRENCE_TYPE_ONCE = 0;
  RECURRENCE_TYPE_DAILY = 1;
  RECURRENCE_TYPE_WEEKLY = 2;
  RECURRENCE_TYPE_MONTHLY = 3;
}

message PowerSchedule {
  string id = 1;
  string vm_uuid = 2;
  PowerAction action = 3;
  RecurrenceType recurrence = 4;
  string cron_spec = 5;
  int32 day_of_week = 6;
  int32 day_of_month = 7;
  string time = 8;
  bool enabled = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreatePowerScheduleRequest {
  string vm_uuid = 1;
  PowerAction action = 2;
  RecurrenceType recurrence = 3;
  string cron_spec = 4;
  int32 day_of_week = 5;
  int32 day_of_month = 6;
  string time = 7;
  bool enabled = 8;
}

message CreatePowerScheduleResponse {
  bool success = 1;
  string schedule_id = 2;
  optional ErrorResponse error = 3;
}

message ListPowerSchedulesRequest {
  string vm_uuid = 1;
  bool enabled_only = 2;
}

message ListPowerSchedulesResponse {
  repeated PowerSchedule schedules = 1;
  optional ErrorResponse error = 2;
}

message UpdatePowerScheduleRequest {
  string schedule_id = 1;
  optional PowerAction action = 2;
  optional RecurrenceType recurrence = 3;
  optional string cron_spec = 4;
  optional int32 day_of_week = 5;
  optional int32 day_of_month = 6;
  optional string time = 7;
  optional bool enabled = 8;
}

message UpdatePowerScheduleResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}

message DeletePowerScheduleRequest {
  string schedule_id = 1;
}

message DeletePowerScheduleResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}