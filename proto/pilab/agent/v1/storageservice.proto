syntax = "proto3";

package pilab.cloud.agent.v1;

import "pilab/agent/v1/stream.proto";
import "pilab/agent/v1/agent_service.proto";
import "pilab/agent/v1/error.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v1;agentv1";

// ----------------------------------------------------------------------------
// Storage Service (Volume and Storage Pool Management)
// ----------------------------------------------------------------------------

service StorageService {
    // Volume Management
    rpc VolumeCreate(VolumeCreateRequest) returns (VolumeCreateResponse);
    rpc VolumeDelete(VolumeDeleteRequest) returns (VolumeDeleteResponse);
    rpc VolumeResize(VolumeResizeRequest) returns (VolumeResizeResponse);
    rpc VolumeList(VolumeListRequest) returns (VolumeListResponse);
    rpc VolumeGet(VolumeGetRequest) returns (VolumeGetResponse);
    rpc VolumeClone(VolumeCloneRequest) returns (VolumeCloneResponse);

    // Snapshot management
    rpc VolumeSnapshotCreate(VolumeSnapshotCreateRequest) returns (VolumeSnapshotCreateResponse);
    rpc VolumeSnapshotRevert(VolumeSnapshotRevertRequest) returns (VolumeSnapshotRevertResponse);
    rpc VolumeSnapshotDelete(VolumeSnapshotDeleteRequest) returns (VolumeSnapshotDeleteResponse);
  
    // Storage Pool Management
    rpc StoragePoolCreate(StoragePoolCreateRequest) returns (StoragePoolCreateResponse);
    rpc StoragePoolDelete(StoragePoolDeleteRequest) returns (StoragePoolDeleteResponse);
    rpc StoragePoolList(StoragePoolListRequest) returns (StoragePoolListResponse);
    rpc StoragePoolGet(StoragePoolGetRequest) returns (StoragePoolGetResponse);
  }
  
  // Volume Messages
  message Volume {
    string name = 1;
    string pool_name = 2;
    uint64 size_gb = 3;
    string format = 4; // e.g., "qcow2", "raw"
    string path = 5;
    // Add other relevant volume details
  }
  
  message VolumeCreateRequest {
    string name = 1;
    string pool_name = 2;
    uint64 size_gb = 3;
    string format = 4;
    optional string backing_store = 5; // For linked clones
  }
  message VolumeCreateResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
    optional Volume volume = 3;
  }
  
  message VolumeDeleteRequest {
    string name = 1;
    string pool = 2;
    optional bool force = 3;
  }
  message VolumeDeleteResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  message VolumeResizeRequest {
    string name = 1;
    string pool = 2;
    uint64 size = 3; // Size in GB.
  }
  message VolumeResizeResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  message VolumeListRequest {
    optional string pool_name = 1; // List volumes in a specific pool
  }
  message VolumeListResponse {
    repeated Volume volumes = 1;
  }
  
  message VolumeGetRequest {
    string name = 1;
    string pool_name = 2;
  }
  message VolumeGetResponse {
    optional Volume volume = 1;
    optional ErrorResponse error = 2;
  }
  
  message VolumeCloneRequest {
    string source_name = 1;
    string source_pool = 2;
    string new_name = 3;
    string new_pool = 4;
    optional bool shallow = 5; // For linked clones
  }
  message VolumeCloneResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
    optional Volume volume = 3; // Details of the new volume
  }
  
  message VolumeSnapshotCreateRequest {
    string volume_name = 1;
    string pool_name = 2;
    string snapshot_name = 3;
  }
  message VolumeSnapshotCreateResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  message VolumeSnapshotRevertRequest {
    string volume_name = 1;
    string pool_name = 2;
    string snapshot_name = 3;
  }
  message VolumeSnapshotRevertResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  message VolumeSnapshotDeleteRequest {
    string volume_name = 1;
    string pool_name = 2;
    string snapshot_name = 3;
  }
  message VolumeSnapshotDeleteResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  // Storage Pool Messages
  message StoragePool {
    string name = 1;
    string type = 2; // e.g., "dir", "lvm"
    string path = 3;
    uint64 capacity_bytes = 4;
    uint64 allocation_bytes = 5;
    uint64 available_bytes = 6;
    // Add other pool details
  }
  
  message StoragePoolCreateRequest {
    string name = 1;
    string type = 2;
    string path = 3;
    // Add other pool configuration options
  }
  message StoragePoolCreateResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
    optional StoragePool pool = 3;
  }
  
  message StoragePoolDeleteRequest {
    string name = 1;
  }
  message StoragePoolDeleteResponse {
    bool success = 1;
    optional ErrorResponse error = 2;
  }
  
  message StoragePoolListRequest {}
  message StoragePoolListResponse {
    repeated StoragePool pools = 1;
  }
  
  message StoragePoolGetRequest {
    string name = 1;
  }
  message StoragePoolGetResponse {
    optional StoragePool pool = 1;
    optional ErrorResponse error = 2;
  }
  