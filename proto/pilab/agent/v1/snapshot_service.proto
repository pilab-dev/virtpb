// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package pilab.cloud.agent.v1;

import "pilab/agent/v1/stream.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v1;agentv1";

service SnapshotService {
  rpc Create(SnapshotCreateRequest) returns (stream SnapshotCreateResponse);
  rpc Restore(SnapshotRestoreRequest) returns (SnapshotRestoreResponse);
  rpc Delete(SnapshotDeleteRequest) returns (SnapshotDeleteResponse);
  rpc Clone(SnapshotCloneRequest) returns (SnapshotCloneResponse);
  rpc Consolidate(SnapshotConsolidateRequest) returns (SnapshotConsolidateResponse);
  rpc List(SnapshotListRequest) returns (SnapshotListResponse);
}

message SnapshotConsolidateRequest {
  string vm = 1;
  string snapshot_name = 2;
}

message SnapshotConsolidateResponse {}

message SnapshotListRequest {
  string vm = 1;
}

message SnapshotInfo {
  string name = 1;
  string description = 2;
  bool memory_snapshot = 3;
  int64 creation_time = 4;
  string parent_name = 5;
}

message SnapshotListResponse {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotRestoreRequest {
  string vm = 1;
  string snapshot_name = 4;
}

message SnapshotRestoreResponse {}

message SnapshotCreateRequest {
  string vm = 1;
  string snapshot_name = 4;
  bool include_memory = 5;
  string description = 6;
}

message SnapshotCreateResponse {
  string snapshot_id = 1;
  int64 created_at = 2;
}

message SnapshotDeleteRequest {
  string vm = 1;
  string snapshot_name = 4;
}

message SnapshotDeleteResponse {}

message SnapshotCloneRequest {
  string vm = 1;
  string snapshot_name = 3;
  string new_vm_name = 4;
}

message SnapshotCloneResponse {}