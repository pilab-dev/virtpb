// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package pilab.agent.v2;

import "pilab/common/v1/authz.proto";

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/agent/v2;agentv2";

service ISCSIService {
  rpc Discover(ISCSIDiscoverRequest) returns (ISCSIDiscoverResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Login(ISCSILoginRequest) returns (ISCSILoginResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Logout(ISCSILogoutRequest) returns (ISCSILogoutResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc DeleteNode(ISCSIDeleteNodeRequest) returns (ISCSIDeleteNodeResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "delete", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Rescan(ISCSIRescanRequest) returns (ISCSIRescanResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Sessions(ISCSISessionsRequest) returns (ISCSISessionsResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "list", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Nodes(ISCSINodesRequest) returns (ISCSINodesResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "list", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetLuns(ISCSIGetLunsRequest) returns (ISCSIGetLunsResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetPaths(ISCSIGetPathsRequest) returns (ISCSIGetPathsResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc ConfigureCHAP(ISCSIConfigureCHAPRequest) returns (ISCSIConfigureCHAPResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc ConfigureCHAPInbound(ISCSIConfigureCHAPInboundRequest) returns (ISCSIConfigureCHAPInboundResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc SetLogin(ISCSISetLoginRequest) returns (ISCSISetLoginResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
}

message ISCSIDiscoverRequest {
  string portal = 1;
}

message ISCSIDiscoverResponse {
  repeated string targets = 1;
}

message ISCSILoginRequest {
  string target = 1;
  string portal = 2;
}

message ISCSILoginResponse {}

message ISCSILogoutRequest {
  string target = 1;
  string portal = 2;
}

message ISCSILogoutResponse {}

message ISCSIDeleteNodeRequest {
  string target = 1;
  string portal = 2;
}

message ISCSIDeleteNodeResponse {}

message ISCSIRescanRequest {
  string target = 1;
}

message ISCSIRescanResponse {}

message ISCSISessionsRequest {}

message ISCSISessionsResponse {
  repeated Session sessions = 1;

  message Session {
    string protocol = 1;
    int64 session_id = 2;
    string portal = 3;
    string target_name = 4;
    string state = 5;
  }
}

message ISCSINodesRequest {}

message ISCSINodesResponse {
  repeated Node nodes = 1;

  message Node {
    string target_name = 1;
    string portal = 2;
    int32 tpgt = 3;
    string state = 4;
  }
}

message ISCSIGetLunsRequest {
  string target = 1;
}

message ISCSIGetLunsResponse {
  repeated Lun luns = 1;

  message Lun {
    int32 number = 1;
    string device = 2;
    int64 size_bytes = 3;
  }
}

message ISCSIGetPathsRequest {
  string target = 1;
}

message ISCSIGetPathsResponse {
  repeated Path paths = 1;

  message Path {
    string device = 1;
    int32 host = 2;
    int32 channel = 3;
    int32 lun = 4;
    string state = 5;
    string mp_device = 6;
  }
}

message ISCSIConfigureCHAPRequest {
  string target = 1;
  string portal = 2;
  string username = 3;
  string password = 4;
}

message ISCSIConfigureCHAPResponse {}

message ISCSIConfigureCHAPInboundRequest {
  string target = 1;
  string portal = 2;
  string username = 3;
  string password = 4;
}

message ISCSIConfigureCHAPInboundResponse {}

message ISCSISetLoginRequest {
  string target = 1;
  bool automatic = 2;
}

message ISCSISetLoginResponse {}