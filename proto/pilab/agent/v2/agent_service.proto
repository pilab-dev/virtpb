  }
  rpc GetNTPConfig(GetNTPConfigRequest) returns (NTPConfig) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc SetNTPConfig(SetNTPConfigRequest) returns (SetNTPConfigResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetCloudStatus(GetCloudStatusRequest) returns (CloudStatus) {
    option (pilab.common.v1.authz) = { authn: AUTHN_PUBLIC };
  }
  rpc AdoptToCloud(AdoptToCloudRequest) returns (AdoptToCloudResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "admin", authn: AUTHN_USER, node_scoped: true };
  }
  rpc DisconnectFromCloud(DisconnectFromCloudRequest) returns (DisconnectFromCloudResponse) {
