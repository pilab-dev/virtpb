message ConfigureManagementNetworkRequest {
  // interface_name must hold the "management" role in node.yaml.
  string interface_name = 1;
  bool dhcp = 2;
  // ip_address is CIDR, e.g. "10.0.0.5/24"; ignored when dhcp is set.
  string ip_address = 3;
  string gateway = 4;
  repeated string dns_servers = 5;
  // revert_after_seconds is how long to wait for ConfirmNetworkChange.
  // 0 means 120; values are clamped to 30..600.
  uint32 revert_after_seconds = 6;
}

message ConfigureManagementNetworkResponse {
  string change_id = 1;
  google.protobuf.Timestamp revert_at = 2;
}

