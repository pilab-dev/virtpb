    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "update", authn: AUTHN_USER };
  }
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "list", authn: AUTHN_USER };
  }
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "get", authn: AUTHN_USER };
  }
  rpc CloneVolume(CloneVolumeRequest) returns (CloneVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "create", authn: AUTHN_USER };
  }
  rpc BackupSystemVolume(BackupSystemVolumeRequest) returns (BackupSystemVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "Snapshot", verb: "snapshot", authn: AUTHN_USER };
  }
  rpc RestoreSystemVolume(RestoreSystemVolumeRequest) returns (RestoreSystemVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "Snapshot", verb: "revert", authn: AUTHN_USER };
  }

  // ConfigureManagementNetwork changes the addressing of the NIC that holds
  // the management role (node.yaml) with an automatic revert: the new
  // configuration is applied, and unless ConfirmNetworkChange arrives (from a
  // client that reached the node on the new address) before revert_after, the
  // previous addresses and default route are restored. A change that cuts the
  // operator off therefore undoes itself.
  rpc ConfigureManagementNetwork(ConfigureManagementNetworkRequest) returns (ConfigureManagementNetworkResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "admin", authn: AUTHN_USER, node_scoped: true };
  }
  rpc ConfirmNetworkChange(ConfirmNetworkChangeRequest) returns (ConfirmNetworkChangeResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "admin", authn: AUTHN_USER, node_scoped: true };
  }
