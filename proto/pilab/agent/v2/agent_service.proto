message Task {
  string task_id = 1;
  string status = 2;
  float progress = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  string error = 6;
}

message CPUTopology {
  uint32 sockets = 1;
  uint32 cores = 2;
  uint32 threads = 3;
}

message CPUPinning {
  uint32 vcpu = 1;
  string cpuset = 2;
}

message NUMAAffinity {
  uint32 node = 1;
  string cpus = 2;
  string memory = 3;
  uint64 size_mb = 4;
}

message CPU {
  uint32 vcpus = 1;
  CPUTopology topology = 2;
  repeated CPUPinning pinning = 3;
  string mode = 4;
  repeated string feature_flags = 5;
  repeated NUMAAffinity numa_affinity = 6;
}

message Memory {
  uint64 allocated_mb = 1;
  bool ballooning = 2;
  bool huge_pages = 3;
  repeated NUMAAffinity numa_affinity = 4;
}

message QOSSettings {
  uint64 read_iops = 1;
  uint64 write_iops = 2;
  string ingress_bandwidth = 3;
  string egress_bandwidth = 4;
}

message DiskEncryption {
  bool enabled = 1;
}

message Disk {
  string id = 1;
  string datastore = 2;
  string format = 3;
  uint64 size_gb = 4;
  string bus = 5;
  uint64 iops_limit = 6;
  QOSSettings qos_settings = 7;
  DiskEncryption encryption = 8;
  string backing_file = 9;
}

message StorageAdapter {
  string type = 1;
  uint32 controllers = 2;
  string controller_type = 3;
}

message Storage {
  repeated Disk disks = 1;
  repeated StorageAdapter adapters = 2;
}

message NetworkInterface {
  string id = 1;
  string virtual_network = 2;
  string mac_address = 3;
  string model = 4;
  QOSSettings qos_settings = 5;
  string pci_passthrough = 6;
}

message Network {
  repeated NetworkInterface interfaces = 1;
}

message BIOS {
  string type = 1;
  repeated string boot_order = 2;
  bool secure_boot = 3;
  bool vtpm = 4;
}

message InputDevice {
  string type = 1;
}

message Input {
  InputDevice keyboard = 1;
  InputDevice mouse = 2;
  repeated string usb_passthrough_devices = 3;
  repeated SerialPort serial_ports = 4;
  repeated string parallel_ports = 5;
}

message SerialPort {
  string device = 1;
}

message Video {
  string adapter = 1;
  uint32 vram_mb = 2;
  bool acceleration_3d = 3;
}

message DiskQOSLimit {
  string disk_id = 1;
  uint64 read_iops = 2;
  uint64 write_iops = 3;
}

message NetworkQOSLimit {
  string interface_id = 1;
  string ingress_bandwidth = 2;
  string egress_bandwidth = 3;
}

message QoS {
  uint32 cpu_shares = 1;
  uint64 memory_limit_mb = 2;
  repeated DiskQOSLimit disk_limits = 3;
  repeated NetworkQOSLimit network_limits = 4;
}

message VirtualMachine {
  string id = 1;
  string name = 2;
  string description = 3;
  string os_type = 4;
  string os_version = 5;
  CPU cpu = 6;
  Memory memory = 7;
  Storage storage = 8;
  Network network = 9;
  BIOS bios = 10;
  Input input = 11;
  Video video = 12;
  QoS qos = 13;
  map<string, string> metadata = 14;
  KernelBoot kernel_boot = 15;
}

// KernelBoot configures direct-kernel boot for a VM.
message KernelBoot {
  string kernel = 1;   // Path to kernel image (vmlinuz)
  string initrd = 2;   // Path to initrd image
  string cmdline = 3;  // Kernel command-line arguments
}


message HostStatus {
  float cpu_load = 1;
  uint64 memory_usage_mb = 2;
  float network_utilization = 3;
  float storage_utilization = 4;
  uint64 uptime = 5;
  map<string, string> metadata = 6;
}

message CloneVMImageFromMinioRequest {
  string minio_bucket = 1;
  string minio_object = 2;
}

message CloneVMImageFromMinioResponse {
  string message = 1;
}

message RegisterHostRequest {
  string director_address = 1;
  string ip_address = 2;
  string username = 4;
  string password = 5;
  map<string, string> metadata = 6;
}

message RegisterHostResponse {
