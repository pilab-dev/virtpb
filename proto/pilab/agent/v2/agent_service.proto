  // Volume Management
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "create", authn: AUTHN_USER };
  }
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualDisk", verb: "delete", authn: AUTHN_USER };
  }
