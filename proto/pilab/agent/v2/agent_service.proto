// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package pilab.agent.v2;

import "pilab/common/v1/authz.proto";

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/agent/v2;agentv2";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pilab/common/v1/vm.proto";
import "pilab/common/v1/host.proto";
import "pilab/common/v1/error.proto";
import "pilab/common/v1/stream.proto";
import "pilab/common/v1/task.proto";
import "pilab/pivirtd/v1/pivirtd.proto";

service AgentService {
  rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetHostStatus(GetHostStatusRequest) returns (HostStatus) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualMachine", verb: "create", authn: AUTHN_USER };
  }
  rpc GetVMDetails(GetVMDetailsRequest) returns (GetVMDetailsResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualMachine", verb: "get", authn: AUTHN_USER };
  }
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse) {
    option (pilab.common.v1.authz) = { kind: "VirtualMachine", verb: "update", authn: AUTHN_USER };
  }
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse) {
