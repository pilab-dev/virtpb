// Package agent provides host-level services for VM management, storage,
// networking, snapshots, DCUI, and agent-director communication.

syntax = "proto3";

package pilab.agent.v2;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v2;agentv2";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pilab/common/v1/vm.proto";
import "pilab/common/v1/host.proto";
import "pilab/common/v1/error.proto";
import "pilab/common/v1/stream.proto";
import "pilab/common/v1/task.proto";

service AgentService {
  rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetHostStatus(GetHostStatusRequest) returns (HostStatus);
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc GetVMDetails(GetVMDetailsRequest) returns (GetVMDetailsResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc StopVM(StopVMRequest) returns (StopVMResponse);
  rpc ForceStopVM(ForceStopVMRequest) returns (ForceStopVMResponse);
  rpc RebootVM(RebootVMRequest) returns (RebootVMResponse);
  rpc PauseVM(PauseVMRequest) returns (PauseVMResponse);
  rpc ResumeVM(ResumeVMRequest) returns (ResumeVMResponse);
  rpc InitiateMigration(InitiateMigrationRequest) returns (InitiateMigrationResponse);
  rpc PrepareForMigration(PrepareForMigrationRequest) returns (PrepareForMigrationResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc RevertToSnapshot(RevertToSnapshotRequest) returns (RevertToSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (Task);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ConfigureNetwork(ConfigureNetworkRequest) returns (ConfigureNetworkResponse);
  rpc ConfigureStorage(ConfigureStorageRequest) returns (ConfigureStorageResponse);
  rpc ConfigureTime(ConfigureTimeRequest) returns (ConfigureTimeResponse);
  rpc SetMaintenanceMode(SetMaintenanceModeRequest) returns (SetMaintenanceModeResponse);
  rpc UpdateHost(UpdateHostRequest) returns (UpdateHostResponse);
  rpc GetContentLibraryItems(GetContentLibraryItemsRequest) returns (GetContentLibraryItemsResponse);
  rpc UploadContentLibraryItem(stream UploadContentLibraryItemRequest) returns (UploadContentLibraryItemResponse);
  rpc ExportOVA(ExportOVARequest) returns (stream ExportOVAResponse);
  rpc ImportOVA(stream ImportOVARequest) returns (ImportOVAResponse);
  rpc DeleteContentLibraryItem(DeleteContentLibraryItemRequest) returns (DeleteContentLibraryItemResponse);
  rpc GetDatastores(GetDatastoresRequest) returns (GetDatastoresResponse);
  rpc GetDatastore(GetDatastoreRequest) returns (GetDatastoreResponse);
  rpc CreateDatastore(CreateDatastoreRequest) returns (CreateDatastoreResponse);
  rpc DeleteDatastore(DeleteDatastoreRequest) returns (DeleteDatastoreResponse);
  rpc GetNetworks(GetNetworksRequest) returns (GetNetworksResponse);
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);
  rpc AttachIso(AttachIsoRequest) returns (AttachIsoResponse);
  rpc DetachIso(DetachIsoRequest) returns (DetachIsoResponse);
  rpc CloneVmFromTemplate(CloneVmFromTemplateRequest) returns (CloneVmFromTemplateResponse);
  rpc GetVMGuestIPs(GetVMGuestIPsRequest) returns (GetVMGuestIPsResponse);
  rpc ChangeVMUserPassword(ChangeVMUserPasswordRequest) returns (ChangeVMUserPasswordResponse);
  rpc AttachCloudInit(AttachCloudInitRequest) returns (AttachCloudInitResponse);
  rpc AttachNetworkInterface(AttachNetworkInterfaceRequest) returns (AttachNetworkInterfaceResponse);
  rpc DetachNetworkInterface(DetachNetworkInterfaceRequest) returns (DetachNetworkInterfaceResponse);
  rpc Stream(stream pilab.common.v1.StreamRequest) returns (stream pilab.common.v1.StreamResponse);
  rpc GetHardwareHealth(GetHardwareHealthRequest) returns (GetHardwareHealthResponse);
  rpc GetSensorData(GetSensorDataRequest) returns (GetSensorDataResponse);
  rpc DefineVM(DefineVMRequest) returns (DefineVMResponse);
  rpc GetVMDefinition(GetVMDefinitionRequest) returns (GetVMDefinitionResponse);
  rpc ControlVM(ControlVMRequest) returns (ControlVMResponse);
  rpc GetVMStatus(GetVMStatusRequest) returns (GetVMStatusResponse);
  rpc GetVMGuestInfo(GetVMGuestInfoRequest) returns (GetVMGuestInfoResponse);
  rpc CreatePowerSchedule(CreatePowerScheduleRequest) returns (CreatePowerScheduleResponse);
  rpc ListPowerSchedules(ListPowerSchedulesRequest) returns (ListPowerSchedulesResponse);
  rpc UpdatePowerSchedule(UpdatePowerScheduleRequest) returns (UpdatePowerScheduleResponse);
  rpc DeletePowerSchedule(DeletePowerScheduleRequest) returns (DeletePowerScheduleResponse);
  rpc WakeOnLAN(WakeOnLANRequest) returns (WakeOnLANResponse);
}

message Task {
  string task_id = 1;
  string status = 2;
  float progress = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  string error = 6;
}

message CPUTopology {
  uint32 sockets = 1;
  uint32 cores = 2;
  uint32 threads = 3;
}

message CPUPinning {
  uint32 vcpu = 1;
  string cpuset = 2;
}

message NUMAAffinity {
  uint32 node = 1;
  string cpus = 2;
  string memory = 3;
  uint64 size_mb = 4;
}

message CPU {
  uint32 vcpus = 1;
  CPUTopology topology = 2;
  repeated CPUPinning pinning = 3;
  string mode = 4;
  repeated string feature_flags = 5;
  repeated NUMAAffinity numa_affinity = 6;
}

message Memory {
  uint64 allocated_mb = 1;
  bool ballooning = 2;
  bool huge_pages = 3;
  repeated NUMAAffinity numa_affinity = 4;
}

message QOSSettings {
  uint64 read_iops = 1;
  uint64 write_iops = 2;
  string ingress_bandwidth = 3;
  string egress_bandwidth = 4;
}

message DiskEncryption {
  bool enabled = 1;
}

message Disk {
  string id = 1;
  string datastore = 2;
  string format = 3;
  uint64 size_gb = 4;
  string bus = 5;
  uint64 iops_limit = 6;
  QOSSettings qos_settings = 7;
  DiskEncryption encryption = 8;
  string backing_file = 9;
}

message StorageAdapter {
  string type = 1;
  uint32 controllers = 2;
  string controller_type = 3;
}

message Storage {
  repeated Disk disks = 1;
  repeated StorageAdapter adapters = 2;
}

message NetworkInterface {
  string id = 1;
  string virtual_network = 2;
  string mac_address = 3;
  string model = 4;
  QOSSettings qos_settings = 5;
  string pci_passthrough = 6;
}

message Network {
  repeated NetworkInterface interfaces = 1;
}

message BIOS {
  string type = 1;
  repeated string boot_order = 2;
  bool secure_boot = 3;
  bool vtpm = 4;
}

message InputDevice {
  string type = 1;
}

message Input {
  InputDevice keyboard = 1;
  InputDevice mouse = 2;
  repeated string usb_passthrough_devices = 3;
  repeated SerialPort serial_ports = 4;
  repeated string parallel_ports = 5;
}

message SerialPort {
  string device = 1;
}

message Video {
  string adapter = 1;
  uint32 vram_mb = 2;
  bool acceleration_3d = 3;
}

message DiskQOSLimit {
  string disk_id = 1;
  uint64 read_iops = 2;
  uint64 write_iops = 3;
}

message NetworkQOSLimit {
  string interface_id = 1;
  string ingress_bandwidth = 2;
  string egress_bandwidth = 3;
}

message QoS {
  uint32 cpu_shares = 1;
  uint64 memory_limit_mb = 2;
  repeated DiskQOSLimit disk_limits = 3;
  repeated NetworkQOSLimit network_limits = 4;
}

message VirtualMachine {
  string id = 1;
  string name = 2;
  string description = 3;
  string os_type = 4;
  string os_version = 5;
  CPU cpu = 6;
  Memory memory = 7;
  Storage storage = 8;
  Network network = 9;
  BIOS bios = 10;
  Input input = 11;
  Video video = 12;
  QoS qos = 13;
  map<string, string> metadata = 14;
}

message HostStatus {
  float cpu_load = 1;
  uint64 memory_usage_mb = 2;
  float network_utilization = 3;
  float storage_utilization = 4;
  uint64 uptime = 5;
  map<string, string> metadata = 6;
}

message CloneVMImageFromMinioRequest {
  string minio_bucket = 1;
  string minio_object = 2;
}

message CloneVMImageFromMinioResponse {
  string message = 1;
}

message RegisterHostRequest {
  string director_address = 1;
  string ip_address = 2;
  string username = 4;
  string password = 5;
  map<string, string> metadata = 6;
}

message RegisterHostResponse {
  string host_id = 1;
  string message = 2;
  string agent_welcome = 3;
}

message HeartbeatRequest {
  string host_id = 1;
}

message HeartbeatResponse {
  string status = 1;
  repeated Task tasks = 2;
}

message GetHostStatusRequest {
  string host_id = 1;
}

message CreateVMRequest {
  VirtualMachine vm = 1;
}

message CreateVMResponse {
  string vm_id = 1;
  string message = 2;
}

message GetVMDetailsRequest {
  string vm_id = 1;
}

message GetVMDetailsResponse {
  VirtualMachine vm = 1;
}

message UpdateVMRequest {
  string vm_id = 1;
  VirtualMachine vm_object = 2;
}

message UpdateVMResponse {
  google.protobuf.Empty message = 1;
}

message DeleteVMRequest {
  string vm_id = 1;
}

message DeleteVMResponse {
  google.protobuf.Empty message = 1;
}

message StartVMRequest {
  string vm_id = 1;
}

message StartVMResponse {
  google.protobuf.Empty message = 1;
}

message StopVMRequest {
  string vm_id = 1;
}

message StopVMResponse {
  google.protobuf.Empty message = 1;
}

message ForceStopVMRequest {
  string vm_id = 1;
}

message ForceStopVMResponse {
  google.protobuf.Empty message = 1;
}

message RebootVMRequest {
  string vm_id = 1;
}

message RebootVMResponse {
  google.protobuf.Empty message = 1;
}

message PauseVMRequest {
  string vm_id = 1;
}

message PauseVMResponse {
  google.protobuf.Empty message = 1;
}

message ResumeVMRequest {
  string vm_id = 1;
}

message ResumeVMResponse {
  google.protobuf.Empty message = 1;
}

message InitiateMigrationRequest {
  string vm_id = 1;
  string target_host = 2;
}

message InitiateMigrationResponse {
  google.protobuf.Empty message = 1;
}

message PrepareForMigrationRequest {
  string vm_id = 1;
  string source_host = 2;
}

message PrepareForMigrationResponse {
  google.protobuf.Empty message = 1;
}

message CreateSnapshotRequest {
  string vm_id = 1;
  string snapshot_name = 2;
  string description = 3;
  bool include_memory = 4;
}

message CreateSnapshotResponse {
  string snapshot_id = 1;
  string message = 2;
}

message RevertToSnapshotRequest {
  string vm_id = 1;
  string snapshot_id = 2;
}

message RevertToSnapshotResponse {
  google.protobuf.Empty message = 1;
}

message DeleteSnapshotRequest {
  string vm_id = 1;
  string snapshot_id = 2;
}

message DeleteSnapshotResponse {
  google.protobuf.Empty message = 1;
}

message GetTaskStatusRequest {
  string task_id = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  google.protobuf.Empty message = 1;
}

message ConfigureNetworkRequest {
  string host_id = 1;
  oneof config_type {
    NetworkInterface network_interface = 2;
    string ovs_config = 3;
  }
}

message ConfigureNetworkResponse {
  google.protobuf.Empty message = 1;
}

message ConfigureStorageRequest {
  string host_id = 1;
  oneof config_type {
    LVMVolume lvm_volume = 2;
    NFSShare nfs_share = 3;
    ISCSITarget iscsi_target = 4;
  }
}

message ConfigureStorageResponse {
  google.protobuf.Empty message = 1;
}

message ConfigureTimeRequest {
  string host_id = 1;
  oneof config_type {
    string ntp_server = 2;
    string timezone = 3;
  }
}

message ConfigureTimeResponse {
  google.protobuf.Empty message = 1;
}

message SetMaintenanceModeRequest {
  string host_id = 1;
  bool enter_maintenance = 2;
  bool evacuate_vms = 3;
}

message SetMaintenanceModeResponse {
  google.protobuf.Empty message = 1;
}

message UpdateHostRequest {
  string host_id = 1;
}

message UpdateHostResponse {
  google.protobuf.Empty message = 1;
}

message LVMVolume {
  string vg_name = 1;
  string lv_name = 2;
  string size = 3;
}

message NFSShare {
  string server = 1;
  string path = 2;
  string mount_point = 3;
}

message ISCSITarget {
  string portal = 1;
  string target = 2;
  string lun = 3;
}

message GetContentLibraryItemsRequest {
  message Filter {
    string type = 1;
    string name = 2;
    map<string, string> tags = 3;
  }
  Filter filter = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetContentLibraryItemsResponse {
  message ContentLibraryItem {
    string id = 1;
    string name = 2;
    string type = 3;
    int64 size = 4;
    string created_at = 5;
    string updated_at = 6;
    map<string, string> tags = 7;
    string checksum = 8;
  }
  repeated ContentLibraryItem items = 1;
  string next_page_token = 2;
}

message UploadContentLibraryItemRequest {
  oneof request {
    ContentLibraryItemInfo metadata = 1;
    bytes chunk_data = 2;
  }
}

message ContentLibraryItemInfo {
  string name = 1;
  string type = 2;
  map<string, string> tags = 3;
}

message UploadContentLibraryItemResponse {
  string id = 1;
  string checksum = 2;
  pilab.common.v1.Error error = 3;
}

message DeleteContentLibraryItemRequest {
  string id = 1;
}

message DeleteContentLibraryItemResponse {
  pilab.common.v1.Error error = 1;
}

message GetDatastoresRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message GetDatastoresResponse {
  message Datastore {
    string id = 1;
    string name = 2;
    string type = 3;
    int64 total_capacity = 4;
    int64 available_capacity = 5;
    repeated string supported_formats = 6;
    bool is_local = 7;
    map<string, string> connection_info = 8;
  }
  repeated Datastore datastores = 1;
  string next_page_token = 2;
}

message GetDatastoreRequest {
  string id = 1;
}

message GetDatastoreResponse {
  message Datastore {
    string id = 1;
    string name = 2;
    string type = 3;
    int64 total_capacity = 4;
    int64 available_capacity = 5;
    repeated string supported_formats = 6;
    bool is_local = 7;
    map<string, string> connection_info = 8;
  }
  Datastore datastore = 1;
  pilab.common.v1.Error error = 2;
}

message CreateDatastoreRequest {
  string name = 1;
  string type = 2;
  map<string, string> connection_info = 3;
}

message CreateDatastoreResponse {
  string id = 1;
  pilab.common.v1.Error error = 2;
}

message DeleteDatastoreRequest {
  string id = 1;
}

message DeleteDatastoreResponse {
  pilab.common.v1.Error error = 1;
}

message GetNetworksRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message NetworkDefinition {
  string id = 1;
  string name = 2;
  string type = 3;
  string bridge_name = 4;
  map<string, string> connection_info = 5;
}

message GetNetworksResponse {
  repeated NetworkDefinition networks = 1;
  string next_page_token = 2;
}

message GetNetworkRequest {
  string id = 1;
}

message GetNetworkResponse {
  NetworkDefinition network = 1;
  pilab.common.v1.Error error = 2;
}

message CreateNetworkRequest {
  string name = 1;
  string type = 2;
  string bridge_name = 3;
}

message CreateNetworkResponse {
  string id = 1;
  pilab.common.v1.Error error = 2;
}

message DeleteNetworkRequest {
  string id = 1;
}

message DeleteNetworkResponse {
  pilab.common.v1.Error error = 1;
}

message AttachIsoRequest {
  string vm_id = 1;
  string iso_id = 2;
}

message AttachIsoResponse {
  pilab.common.v1.Error error = 1;
}

message DetachIsoRequest {
  string vm_id = 1;
  string iso_id = 2;
}

message DetachIsoResponse {
  pilab.common.v1.Error error = 1;
}

message CloneVmFromTemplateRequest {
  string template_id = 1;
  string vm_name = 2;
  string datastore_id = 3;
  map<string, string> vm_overrides = 4;
}

message CloneVmFromTemplateResponse {
  string vm_id = 1;
  pilab.common.v1.Error error = 2;
}

message GetVMGuestIPsRequest {
  string vm_id = 1;
}

message GetVMGuestIPsResponse {
  repeated InterfaceAddress addresses = 1;
}

message InterfaceAddress {
  string mac = 1;
  repeated string ip = 2;
}

message ChangeVMUserPasswordRequest {
  string vm_id = 1;
  string username = 2;
  string password = 3;
}

message ChangeVMUserPasswordResponse {
  pilab.common.v1.Error error = 1;
}

message AttachCloudInitRequest {
  string vm_id = 1;
  bytes cloud_init_iso = 2;
}

message AttachCloudInitResponse {
  pilab.common.v1.Error error = 1;
}

message AttachNetworkInterfaceRequest {
  string vm_id = 1;
  string network_name = 2;
  optional string mac_address = 3;
  map<string, string> options = 4;
}

message AttachNetworkInterfaceResponse {
  bool success = 1;
  pilab.common.v1.Error error = 2;
}

message DetachNetworkInterfaceRequest {
  string vm_id = 1;
  string mac_address = 2;
}

message DetachNetworkInterfaceResponse {
  bool success = 1;
  pilab.common.v1.Error error = 2;
}

message GetHardwareHealthRequest {}

message GetHardwareHealthResponse {
  string overall_status = 1;
  repeated pilab.common.v1.SensorData sensors = 2;
  string firmware_version = 3;
  string power_status = 4;
  pilab.common.v1.Error error = 5;
}

message GetSensorDataRequest {
  optional string sensor_name = 1;
}

message GetSensorDataResponse {
  repeated pilab.common.v1.SensorData sensors = 1;
  pilab.common.v1.Error error = 2;
}

enum ControlCommand {
  CONTROL_COMMAND_UNSPECIFIED = 0;
  CONTROL_COMMAND_STOP = 1;
  CONTROL_COMMAND_KILL = 2;
  CONTROL_COMMAND_SUSPEND = 3;
  CONTROL_COMMAND_RESUME = 4;
  CONTROL_COMMAND_REBOOT = 5;
  CONTROL_COMMAND_SHUTDOWN = 6;
  CONTROL_COMMAND_RESET = 7;
}

message DefineVMRequest {
  string vm_definition = 1;
  optional bool boot_on_create = 2;
}

message DefineVMResponse {
  bool success = 1;
  string message = 2;
  pilab.common.v1.Error error = 3;
  string vm_uuid = 4;
}

message GetVMDefinitionRequest {
  string vm_id = 1;
  bool force_fetch = 2;
}

message GetVMDefinitionResponse {
  string vm_definition = 1;
}

message ControlVMRequest {
  string vm_id = 1;
  ControlCommand command = 2;
}

message ControlVMResponse {
  bool success = 1;
  string message = 2;
  pilab.common.v1.Error error = 3;
}

message GetVMStatusRequest {
  string vm_id = 1;
}

message GetVMStatusResponse {
  string status = 1;
}

message GetVMGuestInfoRequest {
  string vm_id = 1;
}

message GetVMGuestInfoResponse {
  pilab.common.v1.VmGuestOS os_info = 1;
  repeated pilab.common.v1.VmGuestNetworkInterface network_interfaces = 2;
}

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_REBOOT = 3;
}

enum RecurrenceType {
  RECURRENCE_TYPE_UNSPECIFIED = 0;
  RECURRENCE_TYPE_DAILY = 1;
  RECURRENCE_TYPE_WEEKLY = 2;
  RECURRENCE_TYPE_MONTHLY = 3;
}

message PowerSchedule {
  string id = 1;
  string vm_uuid = 2;
  PowerAction action = 3;
  RecurrenceType recurrence = 4;
  string cron_spec = 5;
  int32 day_of_week = 6;
  int32 day_of_month = 7;
  string time = 8;
  bool enabled = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreatePowerScheduleRequest {
  string vm_uuid = 1;
  PowerAction action = 2;
  RecurrenceType recurrence = 3;
  string cron_spec = 4;
  int32 day_of_week = 5;
  int32 day_of_month = 6;
  string time = 7;
  bool enabled = 8;
}

message CreatePowerScheduleResponse {
  bool success = 1;
  string schedule_id = 2;
  pilab.common.v1.Error error = 3;
}

message ListPowerSchedulesRequest {
  string vm_uuid = 1;
  bool enabled_only = 2;
}

message ListPowerSchedulesResponse {
  repeated PowerSchedule schedules = 1;
  pilab.common.v1.Error error = 2;
}

message UpdatePowerScheduleRequest {
  string schedule_id = 1;
  optional PowerAction action = 2;
  optional RecurrenceType recurrence = 3;
  optional string cron_spec = 4;
  optional int32 day_of_week = 5;
  optional int32 day_of_month = 6;
  optional string time = 7;
  optional bool enabled = 8;
}

message UpdatePowerScheduleResponse {
  bool success = 1;
  pilab.common.v1.Error error = 2;
}

message DeletePowerScheduleRequest {
  string schedule_id = 1;
}

message DeletePowerScheduleResponse {
  bool success = 1;
  pilab.common.v1.Error error = 2;
}

message WakeOnLANRequest {
  string vm_id = 1;
  string mac_address = 2;
}

message WakeOnLANResponse {
  bool success = 1;
  string message = 2;
  pilab.common.v1.Error error = 3;
}

message ExportOVARequest {
  string vm_id = 1;
  string datastore_id = 2;
}

message ExportOVAResponse {
  bytes chunk_data = 1;
  float progress = 2;
  string filename = 3;
}

message ImportOVARequest {
  oneof request {
    ImportOVAInfo metadata = 1;
    bytes chunk_data = 2;
  }
}

message ImportOVAInfo {
  string vm_name = 1;
  string datastore_id = 2;
  string description = 3;
  map<string, string> metadata = 4;
}

message ImportOVAResponse {
  string vm_id = 1;
  string message = 2;
  pilab.common.v1.Error error = 3;
}