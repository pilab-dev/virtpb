  }
  rpc RemoveFirewallRule(RemoveFirewallRuleRequest) returns (RemoveFirewallRuleResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "delete", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetDNSConfig(GetDNSConfigRequest) returns (DNSConfig) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc SetDNSConfig(SetDNSConfigRequest) returns (SetDNSConfigResponse) {
