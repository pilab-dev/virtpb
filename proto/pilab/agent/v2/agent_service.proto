  string name = 1;
  string display_name = 2;
  string mac_address = 3;
  bool link_up = 4;
  bool managed = 5;
  string ip_address = 6;
  string netmask = 7;
  string gateway = 8;
  repeated string dns_servers = 9;
  repeated VlanInterface vlans = 10;
  string bridge_name = 11;
  repeated string bridges = 12;
}

message VlanInterface {
  int32 vlan_id = 1;
  string name = 2;
  string ip_address = 3;
  string netmask = 4;
}

message Route {
  string destination = 1;
  string gateway = 2;
  string interface_name = 3;
  int32 metric = 4;
}

message ConfigureNetworkInterfaceRequest {
  string interface_name = 1;
  bool dhcp = 2;
