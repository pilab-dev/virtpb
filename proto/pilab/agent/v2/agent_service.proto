  }

  // Host Management & DCUI
  rpc GetHostInfo(GetHostInfoRequest) returns (HostInfo) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetSystemResources(GetSystemResourcesRequest) returns (SystemResources) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetServiceStatus(GetServiceStatusRequest) returns (ServiceStatusList) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse) {
    option (pilab.common.v1.authz) = { kind: "Node", verb: "admin", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetNetworkConfig(GetNetworkConfigRequest) returns (NetworkConfig) {
    option (pilab.common.v1.authz) = { kind: "NetworkSegment", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc ConfigureNetworkInterface(ConfigureNetworkInterfaceRequest) returns (ConfigureNetworkInterfaceResponse) {
    option (pilab.common.v1.authz) = { kind: "NetworkSegment", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc TestNetwork(TestNetworkRequest) returns (NetworkTestResult) {
    option (pilab.common.v1.authz) = { kind: "NetworkSegment", verb: "update", authn: AUTHN_USER, node_scoped: true };
  }
  rpc GetStorageConfig(GetStorageConfigRequest) returns (StorageConfig) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "get", authn: AUTHN_USER, node_scoped: true };
  }
  rpc MountNFS(MountNFSRequest) returns (MountNFSResponse) {
    option (pilab.common.v1.authz) = { kind: "StoragePool", verb: "create", authn: AUTHN_USER, node_scoped: true };
  }
  rpc UnmountNFS(UnmountNFSRequest) returns (UnmountNFSResponse) {
