// Package director provides distributed task orchestration and agent coordination.
// This package includes task queue management, job tracking, and director-agent communication.

syntax = "proto3";

package pilab.director.v1;

import "pilab/common/v1/host.proto";
import "pilab/common/v1/task.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/director/v1;directorv1";

message VmGuestInfo {
  string vm_id = 1;
  string info = 2;
}

message AgentEventsRequest {
  oneof event {
    VmStateEvent vm_state_event = 1;
    HeartbeatEvent heartbeat = 2;
    VmDefinition vm_definition = 3;
    pilab.common.v1.HostStats host_stats = 4;
    pilab.common.v1.VmMetrics vm_metrics = 5;
    pilab.common.v1.JobStatus job_status = 6;
    VmGuestInfo vm_guest_info = 7;
  }
}

message HeartbeatEvent {
  string host_id = 1;
  uint32 elapsed_time = 2;
}

message VmDefinition {
  string domain_xml = 1;
  string domain_uuid = 2;
  uint32 state = 3;
  string name = 5;
}

message VmStateEvent {
  string vm_id = 1;
  string vm_name = 2;
  string event = 3;
  string detail = 4;
}

message DiskStateEvent {
  string path = 1;
  string event = 2;
}

message ManagerMessage {
  oneof message {
    ResourceRefreshRequest resource_refresh_request = 2;
    ClusterJoinRequest cluster_join = 3;
    ClusterLeaveRequest cluster_leave = 4;
  }
}

message ResourceRefreshRequest {}

message ClusterJoinRequest {
  string cluster_id = 1;
  repeated ClusterBridgeConfig bridges = 2;
}

message ClusterBridgeConfig {
  string name = 1;
  string network_type = 2;
  uint32 vlan = 3;
  uint32 mtu = 4;
  repeated string uplinks = 5;
}

message ClusterLeaveRequest {
  string cluster_id = 1;
  bool force = 2;
}

message RegisterAgentRequest {
  string hostname = 1;
  string agent_version = 2;
  uint32 cores_count = 3;
  string platform = 4;
  string platform_family = 5;
  uint32 uptime = 6;
  string virtualization_system = 7;
  string virtualization_role = 8;
  string kernel_version = 10;
  string kernel_arch = 11;
  string cpu_vendor_id = 13;
  string cpu_family = 14;
  string cpu_model = 15;
  string cpu_model_name = 16;
  uint32 cpu_mhz = 17;
  uint32 cpu_cache_size = 18;
  repeated string cpu_flags = 19;
  uint64 mem_size = 20;
  string host_state = 9999;
}

message RegisterAgentResponse {
  oneof response {
    string director_welcome = 1;
    string error_reason = 2;
  }
}

service CloudDirectorService {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc AgentEvents(stream AgentEventsRequest) returns (stream ManagerMessage);
}