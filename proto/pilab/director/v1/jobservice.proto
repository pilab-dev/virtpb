// Package director provides distributed task orchestration and agent coordination.
// This package includes task queue management, job tracking, and director-agent communication.

syntax = "proto3";

package pilab.director.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/director/v1;directorv1";

service JobService {
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message Job {
  string job_id = 1;
  string status = 2;
  string message = 3;
  uint32 progress = 4;
  uint64 start_time = 5;
  uint64 end_time = 6;
  string job_type = 7;
  string vm_id = 8;
  bytes params = 9;
}

message SubscribeRequest {}

message SubscribeResponse {
  Job job = 1;
}

message UpdateJobRequest {
  string job_id = 1;
  string status = 2;
  string message = 3;
  uint32 progress = 4;
}

message UpdateJobResponse {}