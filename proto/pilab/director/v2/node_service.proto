// Package director provides distributed task orchestration and agent coordination.
// NodeService is the PIVIRT-83 (control-plane consolidation, Phase 2) session
// stream: one bidirectional stream per node, replacing
// director/v1.CloudDirectorService.AgentEvents and (eventually, Phase 5)
// TaskService.Subscribe. A node's identity is a director-minted UUID bound
// to its mTLS client certificate, never a client-supplied claim.

syntax = "proto3";

package pilab.director.v2;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/director/v2;directorv2";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "pilab/director/v2/task_service.proto";
import "pilab/pivirtd/v1/host_resource.proto";
import "pilab/pivirtd/v1/pivirtd.proto";
import "pilab/common/v1/phase.proto";
import "pilab/resource/v1/resource.proto";

service NodeService {
  // Register establishes (first join) or re-establishes (reconnect) a
  // node's identity with the director. On first join, called without an
  // mTLS client certificate yet -- authenticated instead by
  // bootstrap_token -- and the director mints a new node_uuid. On
  // reconnect, the caller's mTLS peer identity must already be bound to
  // the supplied node_uuid.
  rpc Register(RegisterNodeRequest) returns (RegisterNodeResponse);

  // RequestCertificate submits a CSR for the node_uuid minted by Register
  // and returns a signed mTLS client certificate whose SAN the director
  // asserts itself (spiffe://pilab.hu/node/<node_uuid>), regardless of
  // what the CSR itself claims. Like Register, usable without an existing
  // client certificate via bootstrap_token; a node_uuid may only be
  // certified once (rejects if already bound to a peer identity).
  rpc RequestCertificate(RequestCertificateRequest) returns (RequestCertificateResponse);

  // Session is the node's single long-lived stream to the director. It
  // requires a verified mTLS client certificate -- there is no
  // bootstrap-token path here. The first NodeEvent on the stream must
  // carry the node's current node_uuid and lease_epoch; events from a
  // stale epoch (an older Register than the one currently on record) are
  // dropped, which is what makes a duplicate or restarted agent process
  // safe.
  rpc Session(stream NodeEvent) returns (stream NodeDirective);
}

message RegisterNodeRequest {
  // Empty on first join. On reconnect, must match the node_uuid bound to
  // the caller's mTLS peer identity.
  string node_uuid = 1;
  // Required only when the caller has no client certificate yet (first
  // join). Ignored (and unnecessary) once the node has a director-issued
  // certificate, since the mTLS peer identity is authoritative then.
  string bootstrap_token = 2;
  string hostname = 3;
  string agent_version = 4;
  uint32 cores_count = 5;
  uint64 mem_size = 6;
  string platform = 7;
  string platform_family = 8;
  string kernel_version = 9;
  string kernel_arch = 10;
}

message RegisterNodeResponse {
  string node_uuid = 1;
  int64 lease_epoch = 2;
}

message RequestCertificateRequest {
  string node_uuid = 1;
  string bootstrap_token = 2;
  // PEM-encoded PKCS#10 certificate signing request. Any SAN it contains
  // is ignored -- the director asserts the SAN itself.
  string csr_pem = 3;
}

message RequestCertificateResponse {
  string certificate_pem = 1;
  string ca_chain_pem = 2;
}

message NodeEvent {
  string node_uuid = 1;
  int64 lease_epoch = 2;
  // Monotonic per-epoch sequence number, for gap detection.
  int64 seq = 3;

  oneof event {
    HeartbeatEvent heartbeat = 4;
    pilab.pivirtd.v1.HostResourceReport host_report = 5;
    VmStatusEvent vm_status = 6;
    VmMetricsBatch vm_metrics = 7;
    TaskProgressEvent task_progress = 8;
    TaskResultEvent task_result = 9;
    FullInventoryEvent full_inventory = 10;
    // The node's answer to a ResourceDirective (PIVIRT-172).
    ResourceResultEvent resource_result = 11;
    // Host utilisation metrics forwarded from pivirtd's StatsCollector.
    HostMetricsEvent host_metrics = 12;
  }
}

// VmMetricsBatch carries one stats snapshot from pivirtd's StatsCollector
// (PIVIRT-211). One batch per StatsCollector tick; VMs with no uid are dropped.
message VmMetricsBatch {
  google.protobuf.Timestamp at = 1;
  repeated VmMetricsSample samples = 2;
}

message VmMetricsSample {
  // uid is the director-minted cluster identity; empty means no uid assigned.
  string uid = 1;
  string vm_uuid = 2;
  string vm_name = 3;
  double cpu_percent = 4;
  double host_cpu_percent = 5;
  int64 mem_total_mb = 6;
  int64 mem_used_mb = 7;
  int64 mem_guest_available_mb = 8;
  repeated pilab.pivirtd.v1.DiskStats disks = 9;
  repeated pilab.pivirtd.v1.NetworkStats nics = 10;
}

// HostMetricsEvent wraps pivirtd's HostStats for the session stream.
message HostMetricsEvent {
  pilab.pivirtd.v1.HostStats stats = 1;
}

// ResourceResultEvent reports what applying a ResourceDirective did on the
// host, one outcome per resource, in the directive's order.
message ResourceResultEvent {
  string directive_id = 1;
  repeated ResourceOutcome outcomes = 2;
}

message ResourceOutcome {
  string kind = 1;
  string name = 2;
  // "CREATED", "UPDATED", "UNCHANGED", "DELETED" or "FAILED".
  string outcome = 3;
  string error = 4;
  // The host object's generation and observed generation after the apply,
  // so the director can tell "accepted" from "realized".
  uint64 generation = 5;
  uint64 observed_generation = 6;
}

message HeartbeatEvent {
  google.protobuf.Timestamp timestamp = 1;
}

message VmStatusEvent {
  string vm_name = 1;
  // vm_uuid is the hypervisor-level VM UUID (pivirtd's own identifier,
  // e.g. VMInfo.uuid) -- same meaning as the vm_uuid field on
  // pivirtd/v1's VmLifecycleEvent/VmDiskMoveEvent/VmSnapshotEvent, which
  // this event family sits alongside. It is NOT the director-minted
  // cluster identity; see uid below.
  string vm_uuid = 2;
  string previous_state = 3;
  string new_state = 4;

  // generation/observed_generation/phase are PIVIRT-84 (Phase 3): what the
  // node last reconciled this VM to, for drift detection. See
  // control-plane-architecture.md §2.5 / D4.
  uint64 generation = 5;
  uint64 observed_generation = 6;
  pilab.common.v1.Phase phase = 7;
  // uid is the director-minted cluster identity (control-plane-
  // architecture.md §2.7 / D6) -- distinct from vm_uuid above. Empty for
  // a VM the node has never received a uid for.
  string uid = 8;
}

message TaskProgressEvent {
  string task_id = 1;
  google.protobuf.Struct progress = 2;
}

message TaskResultEvent {
  string task_id = 1;
  TaskStatus status = 2;
  string error_message = 3;
}

// FullInventoryEvent is the agent's reply to a ResyncDirective: every VM
// the node's projection holds, for the director to diff against cluster
// state (control-plane-architecture.md §2.5 / D4, resync table).
message FullInventoryEvent {
  message VmEntry {
    // vm_uuid is the hypervisor-level VM UUID (pivirtd's own identifier) --
    // see VmStatusEvent.vm_uuid's comment. Not the cluster identity; see
    // uid below.
    string vm_uuid = 1;
    string vm_name = 2;
    string state = 3;
    // generation/observed_generation/phase are empty/zero for a VM the
    // node has never received a uid for (hand-made on the host) -- this is
    // exactly the "no uid" row of the resync table, and what a later
    // `terraform import` binds to.
    uint64 generation = 4;
    uint64 observed_generation = 5;
    pilab.common.v1.Phase phase = 6;
    // uid is the director-minted cluster identity (control-plane-
    // architecture.md §2.7 / D6) -- distinct from vm_uuid above. Empty for
    // a VM the node has never received a uid for (the "no uid" row this
    // message's own comment above already describes).
    string uid = 7;
  }
  repeated VmEntry vms = 1;
}

message NodeDirective {
  oneof directive {
    Task task = 1;
    CancelTaskDirective cancel_task = 2;
    ResyncDirective resync = 3;
    ConfigDirective config = 4;
    ClusterJoinDirective cluster_join = 5;
    ClusterLeaveDirective cluster_leave = 6;
    DrainDirective drain = 7;
    // Host objects the director wants applied or removed on this node
    // (node-resource-apply.md P6, PIVIRT-172). The agent proxies each one
    // to pivirtd's resource service and answers with a ResourceResultEvent.
    ResourceDirective resources = 8;
  }
}

message CancelTaskDirective {
  string task_id = 1;
  string reason = 2;
}

// ResyncDirective asks the node to reply with a FullInventoryEvent. Sent by
// the director on session start and periodically (PIVIRT-84, Phase 3).
message ResyncDirective {}

// ConfigDirective pushes opaque configuration to the node. Transport
// plumbing only in this phase; no producer exists yet.
message ConfigDirective {
  google.protobuf.Struct config = 1;
}

// ResourceDirective carries host objects for the node to apply, in order,
// and objects to delete. The director compiles cluster objects (VPC,
// FloatingIP, SecurityGroup) into these; the host never sees a tenant.
message ResourceDirective {
  // directive_id correlates the ResourceResultEvent; the director keeps
  // it stable for a re-send, so a duplicate delivery is idempotent on both
  // sides (pivirtd's apply is UNCHANGED for an unchanged spec).
  string directive_id = 1;
  // apply is ordered: a bridge before the segment on it, an overlay
  // before the port security that assumes its bridge.
  repeated pilab.resource.v1.Resource apply = 2;
  // delete names objects to remove, applied after apply.
  repeated ResourceRef delete = 3;
  // field_manager is recorded on every applied object ("director").
  string field_manager = 4;
}

message ResourceRef {
  string kind = 1;
  string name = 2;
  string uid = 3;
}

// ClusterJoinDirective/ClusterLeaveDirective/DrainDirective are transport
// plumbing only in this phase -- wiring them to pkg/netcluster's cluster
// membership concept is new integration work, not part of PIVIRT-83.
message ClusterJoinDirective {
  string cluster_id = 1;
}

message ClusterLeaveDirective {
  string cluster_id = 1;
  bool force = 2;
}

message DrainDirective {
  string reason = 1;
}
