// Package director provides distributed task orchestration and agent coordination.
// This package includes task queue management, job tracking, and director-agent communication.

syntax = "proto3";

package pilab.director.v2;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/director/v2;directorv2";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service TaskService {
  rpc Subscribe(SubscribeRequest) returns (stream Task);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc GetTaskHistory(GetTaskHistoryRequest) returns (GetTaskHistoryResponse);
  rpc BatchUpdateTasks(BatchUpdateTasksRequest) returns (BatchUpdateTasksResponse);
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_VM_CREATE = 1;
  TASK_TYPE_VM_START = 2;
  TASK_TYPE_VM_STOP = 3;
  TASK_TYPE_VM_RESTART = 4;
  TASK_TYPE_VM_PAUSE = 5;
  TASK_TYPE_VM_UNPAUSE = 6;
  TASK_TYPE_VM_DELETE = 7;
  TASK_TYPE_VM_UPDATE = 8;
  TASK_TYPE_VM_MIGRATE = 9;
  TASK_TYPE_VM_SNAPSHOT_CREATE = 10;
  TASK_TYPE_VM_SNAPSHOT_DELETE = 11;
  TASK_TYPE_VM_SNAPSHOT_RESTORE = 12;
  TASK_TYPE_VM_REVERT = 13;
  TASK_TYPE_VM_EXPORT_OVA = 14;
  TASK_TYPE_VM_IMPORT_OVA = 15;
  TASK_TYPE_VM_ATTACH_NETWORK = 16;
  TASK_TYPE_VM_DETACH_NETWORK = 17;
  TASK_TYPE_VM_CLONE = 18;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_CANCELLED = 5;
  TASK_STATUS_SUPERSEDED = 6;
}

message Task {
  string id = 1;
  TaskType type = 2;
  string vm_id = 3;
  string vm_name = 4;
  google.protobuf.Struct params = 5;
  int64 sequence = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
  TaskStatus status = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  string error_message = 12;
  int32 attempts = 13;
  string superseded_by = 14;
  string target_node_id = 15;
  google.protobuf.Timestamp assigned_at = 16;
  int32 priority = 17;
  string reason = 18;
}

message SubscribeRequest {
  string node_id = 1;
  repeated TaskType task_types = 2;
}

message CreateTaskRequest {
  TaskType type = 1;
  string vm_id = 2;
  string vm_name = 3;
  google.protobuf.Struct params = 4;
  string target_node_id = 5;
  string created_by = 6;
  string reason = 7;
  int32 priority = 8;
}

message CreateTaskResponse {
  Task task = 1;
  repeated string superseded_task_ids = 2;
}

message GetTasksRequest {
  string node_id = 1;
  repeated TaskStatus statuses = 2;
  int32 limit = 3;
  string after_sequence = 4;
}

message GetTasksResponse {
  repeated Task tasks = 1;
  string next_sequence = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  string node_id = 2;
  TaskStatus status = 3;
  string error_message = 4;
  google.protobuf.Timestamp completed_at = 5;
  google.protobuf.Struct progress = 6;
}

message UpdateTaskStatusResponse {
  Task task = 1;
}

message BatchUpdateTasksRequest {
  repeated TaskStatusUpdate updates = 1;
}

message TaskStatusUpdate {
  string task_id = 1;
  string node_id = 2;
  TaskStatus status = 3;
  string error_message = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message BatchUpdateTasksResponse {
  repeated Task updated_tasks = 1;
  repeated FailedUpdate errors = 2;
}

message FailedUpdate {
  string task_id = 1;
  string error = 2;
}

message CancelTaskRequest {
  string task_id = 1;
  string cancelled_by = 2;
  string reason = 3;
}

message CancelTaskResponse {
  Task task = 1;
  bool cancelled = 2;
}

message GetTaskHistoryRequest {
  string vm_id = 1;
  int32 limit = 2;
  string before_sequence = 3;
}

message GetTaskHistoryResponse {
  repeated Task tasks = 1;
  string next_sequence = 2;
}

message TaskParams {
  int32 cpu_cores = 1;
  int32 memory_mb = 2;
  int32 disk_gb = 3;
  string image_id = 4;
  repeated string network_ids = 5;
  int32 new_cpu_cores = 6;
  int32 new_memory_mb = 7;
  string target_node_id = 8;
  string snapshot_name = 9;
  string snapshot_id = 10;
  int64 timeout_seconds = 11;
  bool force = 12;
}