// Package frontend provides the web frontend API for host management and monitoring.

syntax = "proto3";

package pilab.frontend.v1;

import "pilab/common/v1/authz.proto";

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/frontend/v1;frontendv1";

service TasksService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (pilab.common.v1.authz) = { kind: "Task", verb: "list", authn: AUTHN_USER };
  }
}

message TaskStatus {
  string id = 1;
  string name = 2;
  string target = 3;
  string status = 4;
  string progress = 5;
  string initiator = 6;
  string start_time = 7;
  string end_time = 8;
  string server = 9;
  string details = 10;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated TaskStatus tasks = 1;
}