// Package frontend provides the web frontend API for host management, monitoring,
// user management, and task tracking.

syntax = "proto3";

package pilab.frontend.v1;

import "pilab/common/v1/authz.proto";

import "google/protobuf/empty.proto";

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/frontend/v1;frontendv1";

service ManagementService {
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "create", authn: AUTHN_USER };
  }
  rpc GetUser(GetUserRequest) returns (User) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "get", authn: AUTHN_USER };
  }
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (User) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "get", authn: AUTHN_USER };
  }
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "get", authn: AUTHN_USER };
  }
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "update", authn: AUTHN_USER };
  }
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "delete", authn: AUTHN_USER };
  }
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "list", authn: AUTHN_USER };
  }
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "User", verb: "admin", authn: AUTHN_USER };
  }
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "create", authn: AUTHN_USER };
  }
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "get", authn: AUTHN_USER };
  }
  rpc GetRoleByName(GetRoleByNameRequest) returns (Role) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "get", authn: AUTHN_USER };
  }
  rpc UpdateRole(UpdateRoleRequest) returns (Role) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "update", authn: AUTHN_USER };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "delete", authn: AUTHN_USER };
  }
  rpc SearchRoles(SearchRolesRequest) returns (SearchRolesResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc AddRoleInheritance(AddRoleInheritanceRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "update", authn: AUTHN_USER };
  }
  rpc RemoveRoleInheritance(RemoveRoleInheritanceRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "update", authn: AUTHN_USER };
  }
  rpc GetParentRoles(GetParentRolesRequest) returns (GetParentRolesResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc GetChildRoles(GetChildRolesRequest) returns (GetChildRolesResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc GetAllParentRoles(GetAllParentRolesRequest) returns (GetAllParentRolesResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc GetAllChildRoles(GetAllChildRolesRequest) returns (GetAllChildRolesResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc CreateRoleGroup(CreateRoleGroupRequest) returns (RoleGroup) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "create", authn: AUTHN_USER };
  }
  rpc GetRoleGroup(GetRoleGroupRequest) returns (RoleGroup) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "get", authn: AUTHN_USER };
  }
  rpc GetRoleGroupByName(GetRoleGroupByNameRequest) returns (RoleGroup) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "get", authn: AUTHN_USER };
  }
  rpc UpdateRoleGroup(UpdateRoleGroupRequest) returns (RoleGroup) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "update", authn: AUTHN_USER };
  }
  rpc DeleteRoleGroup(DeleteRoleGroupRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "delete", authn: AUTHN_USER };
  }
  rpc SearchRoleGroups(SearchRoleGroupsRequest) returns (SearchRoleGroupsResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "list", authn: AUTHN_USER };
  }
  rpc AddUserToRoleGroup(AddUserToRoleGroupRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "create", authn: AUTHN_USER };
  }
  rpc RemoveUserFromRoleGroup(RemoveUserFromRoleGroupRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "delete", authn: AUTHN_USER };
  }
  rpc GetRoleGroupsForUser(GetRoleGroupsForUserRequest) returns (GetRoleGroupsForUserResponse) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "list", authn: AUTHN_USER };
  }
  rpc GetUsersInRoleGroup(GetUsersInRoleGroupRequest) returns (GetUsersInRoleGroupResponse) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "list", authn: AUTHN_USER };
  }
  rpc AssignRoleToUser(AssignRoleToUserRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "create", authn: AUTHN_USER };
  }
  rpc UnassignRoleFromUser(UnassignRoleFromUserRequest) returns (google.protobuf.Empty) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "delete", authn: AUTHN_USER };
  }
  rpc GetRolesForUser(GetRolesForUserRequest) returns (GetRolesForUserResponse) {
    option (pilab.common.v1.authz) = { kind: "RoleBinding", verb: "list", authn: AUTHN_USER };
  }
  rpc GetPermissionsForRole(GetPermissionsForRoleRequest) returns (GetPermissionsForRoleResponse) {
    option (pilab.common.v1.authz) = { kind: "Role", verb: "get", authn: AUTHN_USER };
  }
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string name = 3;
  string password = 4;
  repeated string role_ids = 5;
  repeated string role_group_ids = 6;
  string department = 7;
  string phone = 9;
  bool two_factor_auth_enabled = 10;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByUsernameRequest {
  string username = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UpdateUserRequest {
  string id = 1;
  string username = 2;
  string email = 3;
  string name = 4;
  repeated string role_ids = 5;
  repeated string role_group_ids = 6;
}

message DeleteUserRequest {
  string id = 1;
}

message SearchUsersRequest {
  string query = 1;
  UserFilter filter = 2;
}

message SearchUsersResponse {
  repeated User users = 1;
}

message ChangeUserPasswordRequest {
  string id = 1;
  string new_password = 2;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string name = 4;
  repeated string role_ids = 5;
  repeated string role_group_ids = 6;
  string department = 7;
  string title = 8;
  string phone = 9;
  string avatar = 10;
  string status = 11;
  bool two_factor_auth_enabled = 12;
}

message UserFilter {
  repeated string role_ids = 1;
  repeated string role_group_ids = 2;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated Permission permissions = 3;
  repeated string parent_ids = 4;
}

message GetRoleRequest {
  string id = 1;
}

message GetRoleByNameRequest {
  string name = 1;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  repeated string parent_ids = 5;
}

message DeleteRoleRequest {
  string id = 1;
}

message SearchRolesRequest {
  string query = 1;
  RoleFilter filter = 2;
}

message SearchRolesResponse {
  repeated Role roles = 1;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  repeated string parent_ids = 5;
}

message RoleFilter {
  repeated Permission permissions = 1;
}

message Permission {
  string resource_type = 1;
  string operation = 2;
}

message AddRoleInheritanceRequest {
  string child_role_id = 1;
  string parent_role_id = 2;
}

message RemoveRoleInheritanceRequest {
  string child_role_id = 1;
  string parent_role_id = 2;
}

message GetParentRolesRequest {
  string role_id = 1;
}

message GetParentRolesResponse {
  repeated Role roles = 1;
}

message GetChildRolesRequest {
  string role_id = 1;
}

message GetChildRolesResponse {
  repeated Role roles = 1;
}

message GetAllParentRolesRequest {
  string role_id = 1;
}

message GetAllParentRolesResponse {
  repeated Role roles = 1;
}

message GetAllChildRolesRequest {
  string role_id = 1;
}

message GetAllChildRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleGroupRequest {
  string name = 1;
  string description = 2;
  repeated string role_ids = 3;
}

message GetRoleGroupRequest {
  string id = 1;
}

message GetRoleGroupByNameRequest {
  string name = 1;
}

message UpdateRoleGroupRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string role_ids = 4;
}

message DeleteRoleGroupRequest {
  string id = 1;
}

message SearchRoleGroupsRequest {
  string query = 1;
  RoleGroupFilter filter = 2;
}

message SearchRoleGroupsResponse {
  repeated RoleGroup role_groups = 1;
}

message RoleGroup {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string role_ids = 4;
}

message RoleGroupFilter {
  repeated string role_ids = 1;
}

message AddUserToRoleGroupRequest {
  string user_id = 1;
  string role_group_id = 2;
}

message RemoveUserFromRoleGroupRequest {
  string user_id = 1;
  string role_group_id = 2;
}

message GetRoleGroupsForUserRequest {
  string user_id = 1;
}

message GetRoleGroupsForUserResponse {
  repeated RoleGroup role_groups = 1;
}

message GetUsersInRoleGroupRequest {
  string role_group_id = 1;
}

message GetUsersInRoleGroupResponse {
  repeated User users = 1;
}

message AssignRoleToUserRequest {
  string user_id = 1;
  string role_id = 2;
}

message UnassignRoleFromUserRequest {
  string user_id = 1;
  string role_id = 2;
}

message GetRolesForUserRequest {
  string user_id = 1;
}

message GetRolesForUserResponse {
  repeated Role roles = 1;
}

message GetPermissionsForRoleRequest {
  string role_id = 1;
}

message GetPermissionsForRoleResponse {
  repeated Permission permissions = 1;
}