// Package common provides shared message types for the PiVirt Cloud platform.
// This package includes VM, host, stream, and error definitions used
// across agent, director, frontend, and other services.
//
// The Task/TaskType/TaskStatus/TaskSummary/TaskStatusUpdate messages that
// used to live here were a field-for-field duplicate of
// pilab.director.v2.Task (see resource-model-and-tasks.md §5.1, model #5)
// with zero callers anywhere in the codebase; removed rather than kept in
// sync with a type nothing used.

syntax = "proto3";

package pilab.common.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/common/v1;commonv1";

// JobStatus represents job progress information sent from agent to director.
message JobStatus {
  string job = 1;
  uint64 elapsed_time = 2;
  uint64 remaining_time = 3;
  float progress = 4;
  optional string message = 5;
  optional string host_id = 6;
  string vm_id = 7;
}