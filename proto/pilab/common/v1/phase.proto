// Package common provides shared message types for the PiVirt Cloud platform.
// Phase is the generation-based reconciliation model introduced in PIVIRT-84
// (control-plane Phase 3, see docs/pivirt/control-plane-architecture.md
// §2.5 / D4): a resource is settled iff observed_generation == generation
// and phase == READY. Shared across every cluster-visible resource kind,
// not just VMs.

syntax = "proto3";

package pilab.common.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/common/v1;commonv1";

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PENDING = 1;
  PHASE_PROVISIONING = 2;
  PHASE_READY = 3;
  PHASE_DEGRADED = 4;
  PHASE_DELETING = 5;
  PHASE_UNKNOWN = 6;
  // PHASE_LOST means the node reported the resource's backing disks/state
  // gone during resync -- see control-plane-architecture.md §2.8. Distinct
  // from PHASE_DEGRADED, which still expects to recover on its own.
  PHASE_LOST = 7;
}
