// Package common provides shared message types for the PiVirt Cloud platform.
// This package includes VM, host, task, stream, and error definitions used
// across agent, director, frontend, and other services.

syntax = "proto3";

package pilab.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/common/v1;commonv1";

// VMState represents the lifecycle state of a virtual machine.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_PENDING = 1;
  VM_STATE_RUNNING = 2;
  VM_STATE_STOPPED = 3;
  VM_STATE_PAUSED = 4;
  VM_STATE_SHUTTING_DOWN = 5;
  VM_STATE_ERROR = 6;
  VM_STATE_DELETING = 7;
  VM_STATE_BLOCKED = 8;
  VM_STATE_SHUTDOWN = 9;
  VM_STATE_SHUTOFF = 10;
  VM_STATE_CRASHED = 11;
  VM_STATE_PMSUSPENDED = 12;
}

// DiskState represents the lifecycle state of a disk.
enum DiskState {
  DISK_STATE_UNSPECIFIED = 0;
  DISK_STATE_CREATING = 1;
  DISK_STATE_READY = 2;
  DISK_STATE_ATTACHED = 3;
  DISK_STATE_ERROR = 4;
  DISK_STATE_DELETING = 5;
}

// SnapshotState represents the lifecycle state of a snapshot.
enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_CREATING = 1;
  SNAPSHOT_STATE_READY = 2;
  SNAPSHOT_STATE_ERROR = 3;
  SNAPSHOT_STATE_DELETING = 4;
}

// VM represents a virtual machine with its configuration and state.
message VM {
  string id = 1;
  string name = 2;
  VMState state = 3;
  int32 vcpus = 4;
  int64 memory_mb = 5;
  string os_type = 6;
  string firmware = 7;
  repeated Disk disks = 8;
  repeated NetworkInterface network_interfaces = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  map<string, string> metadata = 12;
  string description = 13;
}

// Disk represents a disk or volume attached to a VM.
message Disk {
  string id = 1;
  string vm_id = 2;
  string name = 3;
  string path = 4;
  string format = 5;
  int64 size_gb = 6;
  string bus = 7;
  string type = 8;
  string device = 9;
  string source_type = 10;
  DiskState state = 11;
  string storage_pool = 12;
  map<string, string> metadata = 13;
}

// NetworkInterface represents a network attachment on a VM.
message NetworkInterface {
  string id = 1;
  string vm_id = 2;
  string name = 3;
  string mac_address = 4;
  string model = 5;
  string network_name = 6;
  string interface_type = 7;
  string source = 8;
  string target = 9;
  string ip_address = 10;
  string subnet_mask = 11;
  bool admin_state_up = 12;
  map<string, string> metadata = 13;
}

// Snapshot represents a point-in-time state of a VM.
message Snapshot {
  string id = 1;
  string name = 2;
  string vm_id = 3;
  string description = 4;
  bool memory_snapshot = 5;
  int64 size_gb = 6;
  google.protobuf.Timestamp created_at = 7;
  SnapshotState state = 8;
  string parent_snapshot_id = 9;
}

// VmGuestOS represents the guest operating system information.
message VmGuestOS {
  string id = 1;
  string name = 2;
  string pretty_name = 3;
  string version = 4;
  string version_id = 5;
  string machine = 6;
  string kernel_release = 7;
  string kernel_version = 8;
}

// VmGuestInterfaceAddress represents an IP address assigned to a network interface.
message VmGuestInterfaceAddress {
  string type = 1;
  string address = 2;
  uint32 prefix = 3;
}

// VmGuestNetworkInterface represents a network interface from the guest agent.
message VmGuestNetworkInterface {
  string name = 1;
  string hwaddr = 2;
  repeated VmGuestInterfaceAddress addresses = 3;
}

// VmGuestInfo contains guest agent information about the VM.
message VmGuestInfo {
  string hostname = 1;
  VmGuestOS os = 2;
  repeated VmGuestNetworkInterface interfaces = 3;
}

// CPUConfig defines CPU configuration for a VM.
message CPUConfig {
  int32 vcpus = 1;
  string model = 2;
  string topology = 3;
  bool nested_virtualization = 4;
}

// MemoryConfig defines memory configuration for a VM.
message MemoryConfig {
  int64 allocated_mb = 1;
  bool ballooning = 2;
  bool huge_pages = 3;
}