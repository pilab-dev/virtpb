// Package common provides shared message types for the PiVirt Cloud platform.
// This package includes VM, host, task, stream, and error definitions used
// across agent, director, frontend, and other services.

syntax = "proto3";

package pilab.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/common/v1;commonv1";

// HostStats contains resource utilization metrics for a host.
message HostStats {
  float cpu_usage = 1;
  float disk_usage = 2;
  uint64 used_memory = 3;
  uint64 total_memory = 4;
}

// VmMetrics contains performance metrics for a VM.
message VmMetrics {
  string vm_id = 1;
  string vm_name = 2;
  uint32 cpu_usage = 3;
  uint32 disk_rd = 4;
  uint32 disk_rd_req = 5;
  uint32 disk_wr = 6;
  uint64 disk_wr_req = 7;
  uint32 network_rx_bytes = 8;
  uint32 network_rx_pkt = 9;
  uint32 network_tx_bytes = 10;
  uint32 network_tx_pkt = 11;
  uint32 memory_usage = 12;
  uint32 memory_total = 13;
}

// CPUMetrics contains CPU utilization metrics.
message CPUMetrics {
  double usage_percent = 1;
}

// MemoryMetrics contains memory utilization metrics.
message MemoryMetrics {
  double usage_percent = 1;
}

// StorageMetrics contains storage utilization metrics.
message StorageMetrics {
  int64 total_gb = 1;
  int64 used_gb = 2;
}

// DataPoint represents a single time-series data point.
message DataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
  string unit = 3;
}

// ResourceAllocationSummary contains allocation summaries for all resources.
message ResourceAllocationSummary {
  CPUAllocation cpu = 1;
  MemoryAllocation memory = 2;
  StorageAllocation storage = 3;
}

// CPUAllocation represents CPU core allocation.
message CPUAllocation {
  int32 total_cores = 1;
  int32 allocated_cores = 2;
}

// MemoryAllocation represents memory allocation.
message MemoryAllocation {
  int64 total_gb = 1;
  int64 allocated_gb = 2;
}

// StorageAllocation represents storage allocation.
message StorageAllocation {
  int64 total_gb = 1;
  int64 used_gb = 2;
}

// SensorData contains hardware sensor readings.
message SensorData {
  string name = 1;
  double value = 2;
  string unit = 3;
  string status = 4;
  string sensor_type = 5;
}

// HardwareHealth contains overall hardware health status.
message HardwareHealth {
  string overall_status = 1;
  repeated SensorData sensors = 2;
  string firmware_version = 3;
  string power_status = 4;
}

// NetworkStats contains network interface statistics.
message NetworkStats {
  string interface = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_packets = 4;
  int64 tx_packets = 5;
  int64 rx_errors = 6;
  int64 tx_errors = 7;
  int64 rx_drops = 8;
  int64 tx_drops = 9;
}