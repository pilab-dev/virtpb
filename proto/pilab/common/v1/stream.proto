// Package common provides shared message types for the PiVirt Cloud platform.
// This package includes VM, host, task, stream, and error definitions used
// across agent, director, frontend, and other services.

syntax = "proto3";

package pilab.common.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/common/v1;commonv1";

// StreamRequest represents a request message in a stream.
message StreamRequest {
  oneof message {
    OpenStreamMessage open = 1;
    bytes payload = 2;
    CloseStreamMessage close = 3;
  }
}

// StreamResponse represents a response message in a stream.
message StreamResponse {
  oneof message {
    bytes payload = 1;
    CloseStreamMessage close = 2;
  }
}

// OpenStreamMessage initiates a stream connection.
message OpenStreamMessage {
  string resource = 1;
  string resource_variant = 2;
}

// CloseStreamMessage closes an active stream connection.
message CloseStreamMessage {}