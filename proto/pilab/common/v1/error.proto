// Package common provides shared message types for the PiVirt Cloud platform.
// This package includes VM, host, task, stream, and error definitions used
// across agent, director, frontend, and other services.

syntax = "proto3";

package pilab.common.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/common/v1;commonv1";

// ErrorResponse represents an error in v1-style RPC responses.
message ErrorResponse {
  string code = 1;
  string message = 2;
  string details = 3;
}

// Error represents a detailed error in v2-style RPC responses.
message Error {
  string code = 1;
  string message = 2;
  string details = 3;
}