// Package ws provides WebSocket-based real-time event streaming for clients.

syntax = "proto3";

package pilab.ws.v1;

import "pilab/common/v1/host.proto";
import "pilab/common/v1/task.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/ws/v1;wsv1";

message JobCreated {
  string job = 1;
  string job_name = 2;
  string resource_type = 3;
  string resource_id = 4;
}

message JobCompleted {
  string job = 1;
  string message = 2;
}

message JobFailed {
  string job = 1;
  string message = 2;
}

message JobList {
  repeated pilab.common.v1.JobStatus jobs = 1;
}

message VmEvent {
  string vm_id = 1;
  string event = 2;
  string detail = 3;
  string state = 4;
}

message Event {
  oneof payload {
    pilab.common.v1.JobStatus job_status = 1;
    JobCreated job_created = 2;
    JobCompleted job_completed = 3;
    JobFailed job_failed = 4;
    VmEvent vm_event = 5;
    pilab.common.v1.HostStats host_stats_event = 6;
    pilab.common.v1.VmMetrics vm_metrics = 7;
  }
}

message SubscribeMessage {
  oneof payload {
    string job = 1;
    string vm_id = 2;
  }
  optional bool unsubscribe = 3;
}

message AuthenticateMessage {
  string token = 1;
}

message JobListRequest {}

message Requests {
  oneof payload {
    SubscribeMessage subscribe = 1;
    AuthenticateMessage authenticate = 2;
  }
}