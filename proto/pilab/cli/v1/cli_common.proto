  bool resize_partition = 4;
  bool wait = 5;
}

message AttachDiskRequest {
  string disk_name = 1;
  string vm_name = 2;
  string device_name = 3;
  bool read_only = 4;
  bool wait = 5;
}

message DetachDiskRequest {
  string disk_name = 1;
  string vm_name = 2;
  bool wait = 3;
}

// -----------------------------------------------------------------------------
// Image Service Request/Response Messages
// -----------------------------------------------------------------------------

message GetImageRequest {
  string name = 1;
}

message ListImagesRequest {
  bool public_only = 1;
  bool private_only = 2;
  string os_family = 3;
  string os_version = 4;
  string family = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListImagesResponse {
  repeated Image images = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateImageRequest {
  string name = 1;
  string source_vm = 2;
  string source_disk = 3;
  string description = 4;
  map<string, string> labels = 5;
  string visibility = 6;
  string family = 7;
  bool no_force_shutdown = 8;
