// =============================================================================
// CLI Common Messages - Shared Across All CLI Services
// =============================================================================
// Purpose: Message definitions used by all CLI service files.
//
// This file provides shared definitions for:
// - User, Organization, ResourceQuota, ResourceUsage
// - VM, MachineType, Image (imported from common)
// - Disk (imported from common)
// - Network, VSwitch, PortGroup
// - SecurityGroup, SecurityRule
// - PublicIP
// - Template, OSTemplate, ImageURL
// - Datastore, DatastoreType, DatastoreStatus
// - HostInfo, NetworkInterfaceInfo, etc.
// =============================================================================

syntax = "proto3";

package pilab.cli.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "pilab/common/v1/vm.proto";
import "pilab/common/v1/task.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/cli/v1;cliv1";

// -----------------------------------------------------------------------------
// User & Organization Messages
// -----------------------------------------------------------------------------

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  repeated string roles = 5;
  repeated string organizations = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Organization {
  string id = 1;
  string name = 2;
  string description = 3;
  string owner_id = 4;
  repeated string member_ids = 5;
  ResourceQuota quota = 6;
  ResourceUsage usage = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ResourceQuota {
  int32 cpu_cores = 1;
  int32 ram_mb = 2;
  int32 disk_gb = 3;
  int32 vms = 4;
  int32 networks = 5;
  int32 public_ips = 6;
}

message ResourceUsage {
  int32 cpu_cores_used = 1;
  int32 ram_mb_used = 2;
  int32 disk_gb_used = 3;
  int32 vms_used = 4;
  int32 networks_used = 5;
  int32 public_ips_used = 6;
}

// -----------------------------------------------------------------------------
// VM & Related (imported from common, re-exported here)
// -----------------------------------------------------------------------------

// VM, Disk, NetworkInterface, Snapshot are imported from pilab.common.v1
// Use pilab.common.v1.VM, etc. in RPCs

message MachineType {
  string id = 1;
  string name = 2;
  int32 cpu_cores = 3;
  int32 ram_mb = 4;
  string category = 5;
}

// -----------------------------------------------------------------------------
// Image Messages
// -----------------------------------------------------------------------------

message Image {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string os_family = 4;
  string os_version = 5;
  string architecture = 6;
  int64 size_gb = 7;
  string format = 8;
  string visibility = 9;
  string family = 10;
  string description = 11;
  map<string, string> labels = 12;
  ImageState state = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

enum ImageState {
  IMAGE_STATE_UNSPECIFIED = 0;
  IMAGE_STATE_CREATING = 1;
  IMAGE_STATE_READY = 2;
  IMAGE_STATE_ERROR = 3;
  IMAGE_STATE_DELETING = 4;
}

// -----------------------------------------------------------------------------
// Network Messages
// -----------------------------------------------------------------------------

message Network {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string cidr_block = 4;
  string zone = 5;
  string description = 6;
  map<string, string> labels = 7;
  NetworkState state = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum NetworkState {
  NETWORK_STATE_UNSPECIFIED = 0;
  NETWORK_STATE_CREATING = 1;
  NETWORK_STATE_READY = 2;
  NETWORK_STATE_ERROR = 3;
  NETWORK_STATE_DELETING = 4;
}

message VSwitch {
  string id = 1;
  string name = 2;
  string type = 3;
  string bridge_name = 4;
  int32 mtu = 5;
  map<string, string> config = 6;
  VSwitchState state = 7;
  repeated string port_groups = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum VSwitchState {
  VSWITCH_STATE_UNSPECIFIED = 0;
  VSWITCH_STATE_CREATING = 1;
  VSWITCH_STATE_READY = 2;
  VSWITCH_STATE_ERROR = 3;
  VSWITCH_STATE_DELETING = 4;
}

message PortGroup {
  string id = 1;
  string name = 2;
  string vswitch_name = 3;
  int32 vlan_id = 4;
  int32 mtu = 5;
  bool allow_promiscuous = 6;
  bool mac_changes = 7;
  bool forged_transmits = 8;
  repeated string allowed_macs = 9;
  PortGroupState state = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

enum PortGroupState {
  PORT_GROUP_STATE_UNSPECIFIED = 0;
  PORT_GROUP_STATE_CREATING = 1;
  PORT_GROUP_STATE_READY = 2;
  PORT_GROUP_STATE_ERROR = 3;
  PORT_GROUP_STATE_DELETING = 4;
}

// -----------------------------------------------------------------------------
// Security Messages
// -----------------------------------------------------------------------------

message SecurityGroup {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string description = 4;
  map<string, string> labels = 5;
  repeated SecurityRule rules = 6;
  SecurityGroupState state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum SecurityGroupState {
  SECURITY_GROUP_STATE_UNSPECIFIED = 0;
  SECURITY_GROUP_STATE_CREATING = 1;
  SECURITY_GROUP_STATE_READY = 2;
  SECURITY_GROUP_STATE_ERROR = 3;
  SECURITY_GROUP_STATE_DELETING = 4;
}

message SecurityRule {
  string id = 1;
  string security_group_id = 2;
  string direction = 3;
  string protocol = 4;
  string ports = 5;
  string source_cidr = 6;
  string source_security_group = 7;
  string destination_cidr = 8;
  string destination_security_group = 9;
  string description = 10;
  int32 priority = 11;
  google.protobuf.Timestamp created_at = 12;
}

// -----------------------------------------------------------------------------
// Public IP Messages
// -----------------------------------------------------------------------------

message PublicIP {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string ip_address = 4;
  string vm_id = 5;
  string zone = 6;
  string description = 7;
  map<string, string> labels = 8;
  PublicIPState state = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

enum PublicIPState {
  PUBLIC_IP_STATE_UNSPECIFIED = 0;
  PUBLIC_IP_STATE_ALLOCATING = 1;
  PUBLIC_IP_STATE_READY = 2;
  PUBLIC_IP_STATE_ASSIGNED = 3;
  PUBLIC_IP_STATE_ERROR = 4;
  PUBLIC_IP_STATE_DELETING = 5;
}

// -----------------------------------------------------------------------------
// Template Messages
// -----------------------------------------------------------------------------

message Template {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string description = 4;
  map<string, string> labels = 5;
  MachineType machine_type = 6;
  Image image = 7;
  int32 root_disk_size_gb = 8;
  string root_disk_type = 9;
  string network = 10;
  repeated string private_networks = 11;
  repeated string security_groups = 12;
  repeated string ssh_keys = 13;
  string userdata = 14;
  string boot_order = 15;
  map<string, string> metadata = 16;
  bool preemptible = 17;
  bool auto_restart_on_maintenance = 18;
  TemplateState state = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

enum TemplateState {
  TEMPLATE_STATE_UNSPECIFIED = 0;
  TEMPLATE_STATE_CREATING = 1;
  TEMPLATE_STATE_READY = 2;
  TEMPLATE_STATE_ERROR = 3;
  TEMPLATE_STATE_DELETING = 4;
}

message OSTemplate {
  string id = 1;
  string os_id = 2;
  string name = 3;
  string full_name = 4;
  string family = 5;
  string vendor = 6;
  string version = 7;
  string architecture = 8;
  int32 cpu_cores = 9;
  int32 memory_mb = 10;
  int32 disk_gb = 11;
  bool cloud_init = 12;
  repeated ImageURL image_urls = 13;
  map<string, string> labels = 14;
  OSTemplateState state = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

enum OSTemplateState {
  OSTEMPLATE_STATE_UNSPECIFIED = 0;
  OSTEMPLATE_STATE_CREATING = 1;
  OSTEMPLATE_STATE_READY = 2;
  OSTEMPLATE_STATE_ERROR = 3;
  OSTEMPLATE_STATE_SYNCING = 4;
}

message ImageURL {
  string url = 1;
  string type = 2;
  string format = 3;
  string variant_id = 4;
  bool cloud_init = 5;
}

// -----------------------------------------------------------------------------
// Datastore Messages
// -----------------------------------------------------------------------------

enum DatastoreType {
  DATASTORE_TYPE_UNSPECIFIED = 0;
  DATASTORE_TYPE_LOCAL = 1;
  DATASTORE_TYPE_NFS = 2;
  DATASTORE_TYPE_ISCSI = 3;
  DATASTORE_TYPE_CEPH = 4;
}

enum DatastoreStatus {
  DATASTORE_STATUS_UNSPECIFIED = 0;
  DATASTORE_STATUS_MOUNTED = 1;
  DATASTORE_STATUS_UNMOUNTED = 2;
  DATASTORE_STATUS_ERROR = 3;
}

message Datastore {
  string id = 1;
  string name = 2;
  DatastoreType type = 3;
  int64 total_capacity = 4;
  int64 available_capacity = 5;
  string mount_path = 6;
  DatastoreStatus status = 7;
  map<string, string> connection_info = 8;
  repeated string supported_formats = 9;
  bool is_local = 10;
  string organization_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// -----------------------------------------------------------------------------
// System Info Messages
// -----------------------------------------------------------------------------

message HostInfo {
  string hostname = 1;
  string os_name = 2;
  string os_version = 3;
  string kernel_version = 4;
  string architecture = 5;
  string hypervisor_type = 6;
  int32 cpu_cores = 7;
  int64 total_memory = 8;
  int64 available_memory = 9;
  int64 uptime_seconds = 10;
  string agent_version = 11;
  string ip_address = 12;
  string mac_address = 13;
  repeated string network_interfaces = 14;
}

message NetworkInterfaceInfo {
  string name = 1;
  string mac_address = 2;
  string ip_address = 3;
  string netmask = 4;
  string gateway = 5;
  repeated string dns_servers = 6;
  bool up = 7;
  bool managed = 8;
  string bridge_name = 9;
  repeated string vlans = 10;
}

message NetworkConfigResponse {
  repeated NetworkInterfaceInfo interfaces = 1;
  string primary_interface = 2;
  bool dhcp_enabled = 3;
  string hostname = 4;
}

message StorageConfigResponse {
  repeated Datastore datastores = 1;
  int64 total_storage = 2;
  int64 used_storage = 3;
  int64 available_storage = 4;
  repeated string local_disks = 5;
}

message ServiceStatus {
  string name = 1;
  string status = 2;
  bool healthy = 3;
  string message = 4;
}

message HostHealthResponse {
  bool overall_healthy = 1;
  int32 cpu_usage_percent = 2;
  int32 memory_usage_percent = 3;
  int32 disk_usage_percent = 4;
  repeated ServiceStatus services = 5;
  repeated string warnings = 6;
  repeated string errors = 7;
  google.protobuf.Timestamp last_updated = 8;
}

message VersionResponse {
  string cli_version = 1;
  string api_version = 2;
  string build_date = 3;
  string git_commit = 4;
}

// -----------------------------------------------------------------------------
// Monitoring Messages
// -----------------------------------------------------------------------------

message MetricPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
  string unit = 3;
}

message GetMetricsResponse {
  repeated MetricPoint data_points = 1;
  string metric_type = 2;
  string vm_name = 3;
}

message ActivityLog {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string action = 4;
  string resource_type = 5;
  string resource_name = 6;
  string resource_id = 7;
  map<string, string> details = 8;
  string ip_address = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// -----------------------------------------------------------------------------
// Auth Service Request/Response Messages
// -----------------------------------------------------------------------------

message LoginRequest {
  string username = 1;
  string password = 2;
  string organization = 3;
  string api_server = 4;
}

message LoginResponse {
  string token = 1;
  string refresh_token = 2;
  User user = 3;
  Organization organization = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message InitiateDeviceAuthRequest {
  string client_id = 1;
  repeated string scopes = 2;
  string audience = 3;
}

message InitiateDeviceAuthResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int32 expires_in = 5;
  int32 interval = 6;
  string message = 7;
}

message PollDeviceAuthRequest {
  string device_code = 1;
  string client_id = 2;
}

message PollDeviceAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int32 expires_in = 4;
  repeated string scopes = 5;
  User user = 6;
  Organization organization = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message LogoutRequest {
  string context_name = 1;
  bool all = 2;
}

// -----------------------------------------------------------------------------
// VM Service Request/Response Messages
// -----------------------------------------------------------------------------

message CreateVMRequest {
  string name = 1;
  string machine_type = 2;
  string image = 3;
  int32 root_disk_size_gb = 4;
  string root_disk_type = 5;
  string network = 6;
  string password = 7;
  repeated string ssh_keys = 8;
  string userdata = 9;
  string boot_order = 10;
  string description = 11;
  map<string, string> labels = 12;
  bool preemptible = 13;
  bool auto_restart_on_maintenance = 14;
  string zone = 15;
  repeated string private_networks = 16;
  string public_ip = 17;
  repeated string security_groups = 18;
  string service_account = 19;
  map<string, string> metadata = 20;
  bool wait = 21;
}

message GetVMRequest {
  string name = 1;
}

message ListVMsRequest {
  string organization_id = 1;
  bool all_organizations = 2;
  map<string, string> label_selector = 3;
  map<string, string> field_selector = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListVMsResponse {
  repeated pilab.common.v1.VM vms = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateVMRequest {
  string name = 1;
  string machine_type = 2;
  string description = 3;
  map<string, string> labels = 4;
  repeated string add_labels = 5;
  repeated string remove_labels = 6;
  string boot_order = 7;
  string password = 8;
  repeated string add_ssh_keys = 9;
  repeated string remove_ssh_keys = 10;
  bool preemptible = 11;
  bool auto_restart_on_maintenance = 12;
  repeated string add_security_groups = 13;
  repeated string remove_security_groups = 14;
  string service_account = 15;
  map<string, string> metadata = 16;
  string rename = 17;
}

message DeleteVMRequest {
  string name = 1;
  bool delete_disks = 2;
}

message StartVMRequest {
  string name = 1;
  bool wait = 2;
}

message StopVMRequest {
  string name = 1;
  bool force = 2;
  bool wait = 3;
}

message RestartVMRequest {
  string name = 1;
  bool wait = 2;
}

message PauseVMRequest {
  string name = 1;
}

message UnpauseVMRequest {
  string name = 1;
}

message MigrateVMRequest {
  string name = 1;
  string destination_host = 2;
  bool live = 3;
}

message RebuildVMRequest {
  string name = 1;
  string image = 2;
  string password = 3;
  repeated string ssh_keys = 4;
  string userdata = 5;
  bool wait = 6;
}

message CloneVMRequest {
  string source_vm_name = 1;
  string new_vm_name = 2;
  bool start = 3;
  bool reset_network = 4;
  bool re_password = 5;
  repeated string new_ssh_keys = 6;
  string new_public_ip = 7;
}

message LinkedCloneVMRequest {
  string source_vm_name = 1;
  string new_vm_name = 2;
  string snapshot_name = 3;
  string image_path = 4;
  bool start = 5;
}

message LinkedCloneVMResponse {
  pilab.common.v1.VM vm = 1;
}

message GetVMConsoleRequest {
  string name = 1;
}

message GetVMConsoleResponse {
  string console_url = 1;
  string console_type = 2;
}

message UpdateVMResourcesRequest {
  string vm_name = 1;
  optional int32 cpu_cores = 2;
  optional int32 memory_mb = 3;
  bool hot_add = 4;
}

message UpdateVMResourcesResponse {
  bool success = 1;
  pilab.common.v1.VM vm = 2;
  string message = 3;
}

message GetVMResourcesRequest {
  string vm_name = 1;
}

message GetVMResourcesResponse {
  string vm_name = 1;
  int32 current_cpu_cores = 2;
  int32 current_memory_mb = 3;
  int32 max_cpu_cores = 4;
  int32 max_memory_mb = 5;
  bool cpu_hot_add_enabled = 6;
  bool memory_hot_add_enabled = 7;
}

// -----------------------------------------------------------------------------
// Disk Service Request/Response Messages
// -----------------------------------------------------------------------------

message CreateDiskRequest {
  string name = 1;
  int64 size_gb = 2;
  string disk_type = 3;
  string storage_pool = 4;
  string source_snapshot = 5;
  string source_image = 6;
  string zone = 7;
  string description = 8;
  map<string, string> labels = 9;
  bool wait = 10;
