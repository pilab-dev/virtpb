message GetDiskRequest {
  string name = 1;
}

message ListDisksRequest {
  string vm_name = 1;
  bool unattached = 2;
  string disk_type = 3;
  string zone = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListDisksResponse {
