// -----------------------------------------------------------------------------
// Snapshot Service Request/Response Messages
// -----------------------------------------------------------------------------

message GetSnapshotRequest {
  string name = 1;
}

message ListSnapshotsRequest {
  string vm_name = 1;
  string disk_name = 2;
  google.protobuf.Duration older_than = 3;
  map<string, string> labels = 4;
