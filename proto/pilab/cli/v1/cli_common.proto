  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateDiskRequest {
  string name = 1;
  string description = 2;
  map<string, string> labels = 3;
  repeated string add_labels = 4;
  repeated string remove_labels = 5;
  string rename = 6;
