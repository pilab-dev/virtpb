}

message GetUserRequest {
  string username = 1;
}

message ListUsersRequest {
  bool all_organizations = 1;
  string organization = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string full_name = 4;
  repeated string add_organization = 5;
  repeated string remove_organization = 6;
  string set_roles_in_organization = 7;
