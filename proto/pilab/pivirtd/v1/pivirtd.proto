// Package pivirtd provides low-level VM lifecycle management on individual hosts.
// This service replaces libvirtd with a cleaner, more modern API.

syntax = "proto3";

package pilab.virtualization.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/pivirtd/v1;pivirtdv1";

import "google/protobuf/timestamp.proto";

service PivirtdService {
  rpc CreateVM(CreateVMRequest) returns (VMResponse);
  rpc StartVM(StartVMRequest) returns (VMResponse);
  rpc StopVM(StopVMRequest) returns (VMResponse);
  rpc PauseVM(PauseVMRequest) returns (VMResponse);
  rpc ResumeVM(ResumeVMRequest) returns (VMResponse);
  rpc RebootVM(RebootVMRequest) returns (VMResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);
  rpc GetVM(GetVMRequest) returns (VMResponse);
  rpc GetVMStats(GetVMStatsRequest) returns (VMStatsResponse);
  rpc ExecuteQMP(ExecuteQMPRequest) returns (ExecuteQMPResponse);
  rpc StreamQMPEvents(StreamQMPRequest) returns (stream QMPEvent);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (SnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);
  rpc GetMigrationStatus(GetMigrationStatusRequest) returns (MigrationStatusResponse);
  rpc CreateStoragePool(CreateStoragePoolRequest) returns (StoragePoolResponse);
  rpc ListStoragePools(ListStoragePoolsRequest) returns (ListStoragePoolsResponse);
  rpc DeleteStoragePool(DeleteStoragePoolRequest) returns (DeleteStoragePoolResponse);
  rpc CreateTAPDevice(CreateTAPDeviceRequest) returns (NetworkResponse);
  rpc DeleteTAPDevice(DeleteTAPDeviceRequest) returns (DeleteNetworkResponse);
  rpc ListTAPDevices(ListTAPDevicesRequest) returns (ListTAPDevicesResponse);
  rpc CreateBridge(CreateBridgeRequest) returns (NetworkResponse);
  rpc DeleteBridge(DeleteBridgeRequest) returns (DeleteNetworkResponse);
  rpc ListBridges(ListBridgesRequest) returns (ListBridgesResponse);
  rpc CreateOVSBridge(CreateOVSBridgeRequest) returns (NetworkResponse);
  rpc DeleteOVSBridge(DeleteOVSBridgeRequest) returns (DeleteNetworkResponse);
  rpc ListOVSBridges(ListOVSBridgesRequest) returns (ListOVSBridgesResponse);
  rpc AddOVSPort(AddOVSPortRequest) returns (NetworkResponse);
  rpc RemoveOVSPort(RemoveOVSPortRequest) returns (DeleteNetworkResponse);
  rpc ListOVSPorts(ListOVSPortsRequest) returns (ListOVSPortsResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream HostEvent);
  rpc GetHostResource(SubscribeEventsRequest) returns (HostResourceReport);
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc AttachVMToNetwork(AttachVMToNetworkRequest) returns (AttachVMToNetworkResponse);
}

message CreateVMRequest {
  string name = 1;
  int32 memory_mb = 2;
  int32 vcpus = 3;
  string machine = 4;
  CPUConfig cpu = 5;
  repeated DiskConfig disks = 6;
  repeated NetworkConfig networks = 7;
  GraphicsConfig graphics = 8;
  bool autostart = 9;
  string cloud_image = 10;
  string disk_path = 11;
  string user_data = 12;
  string meta_data = 13;
  string ssh_key = 14;
  string firmware = 15;
  EFIConfig efi = 16;
  int32 max_memory_mb = 17;
  int32 memory_slots = 18;
  int32 max_vcpus = 19;
  ResourceSpec resources = 20;
  bytes hades_definition = 21; // Serialized JSON/binary hades.VirtualMachine configuration (Option A)
}

message StartVMRequest {
  string name = 1;
}

message StopVMRequest {
  string name = 1;
  bool force = 2;
}

message PauseVMRequest {
  string name = 1;
}

message ResumeVMRequest {
  string name = 1;
}

message RebootVMRequest {
  string name = 1;
  bool force = 2;
}

message DeleteVMRequest {
  string name = 1;
  bool force = 2;
}

message GetVMRequest {
  string name = 1;
}

message ListVMsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message VMResponse {
  VMInfo vm = 1;
  string error = 2;
}

message DeleteVMResponse {
  bool success = 1;
  string error = 2;
}

message ListVMsResponse {
  repeated VMInfo vms = 1;
  string next_page_token = 2;
}

message VMInfo {
  string name = 1;
  string uuid = 2;
  string state = 3;
  int32 memory_mb = 4;
  int32 vcpus = 5;
  string machine = 6;
  CPUConfig cpu = 7;
  repeated DiskConfig disks = 8;
  repeated NetworkConfig networks = 9;
  string folder = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string firmware = 13;
  EFIConfig efi = 14;
  int32 max_memory_mb = 15;
  int32 memory_slots = 16;
  int32 max_vcpus = 17;
  ResourceSpec resources = 18;
  bytes hades_definition = 19; // Serialized JSON/binary hades.VirtualMachine configuration (Option A)
}

message CPUConfig {
  string model = 1;
  string topology = 2;
  bool nested_virtualization = 3;
}

message DiskConfig {
  string id = 1;
  string path = 2;
  string format = 3;
  int32 size_gb = 4;
  string bus = 5;
  bool readonly = 6;
  bool cache = 7;
}

message NetworkConfig {
  string id = 1;
  string type = 2;
  string tap_name = 3;
  string bridge_name = 4;
  string model = 5;
  string mac_address = 6;
  bool link_up = 7;
}

message GraphicsConfig {
  string type = 1;
  int32 port = 2;
  string listen = 3;
  bool password_protected = 4;
}

message GetVMStatsRequest {
  string name = 1;
}

message VMStatsResponse {
  string name = 1;
  CPUStats cpu_stats = 2;
  MemoryStats memory_stats = 3;
  repeated DiskStats disk_stats = 4;
  repeated NetworkStats network_stats = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message CPUStats {
  double usage_percent = 1;
  int32 online_vcpus = 2;
  int32 total_vcpus = 3;
}

message MemoryStats {
  int64 total_mb = 1;
  int64 used_mb = 2;
  int64 balloon_current_mb = 3;
  int64 balloon_max_mb = 4;
}

message DiskStats {
  string device = 1;
  int64 read_bytes = 2;
  int64 write_bytes = 3;
  int64 read_ops = 4;
  int64 write_ops = 5;
}

message NetworkStats {
  string interface = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_packets = 4;
  int64 tx_packets = 5;
}

message ExecuteQMPRequest {
  string vm_name = 1;
  string command = 2;
  string arguments_json = 3;
}

message ExecuteQMPResponse {
  string result_json = 1;
  string error = 2;
}

message StreamQMPRequest {
  string vm_name = 1;
  repeated string event_types = 2;
}

message QMPEvent {
  string event = 1;
  string data_json = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message CreateSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string description = 3;
}

message ListSnapshotsRequest {
  string vm_name = 1;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message RestoreSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message DeleteSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message SnapshotResponse {
  SnapshotInfo snapshot = 1;
  string error = 2;
}

message DeleteSnapshotResponse {
  bool success = 1;
  string error = 2;
}

message SnapshotInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 vm_state_size = 4;
  google.protobuf.Timestamp date = 5;
}

message MigrateVMRequest {
  string vm_name = 1;
  string destination_uri = 2;
  bool incremental = 3;
  bool compress = 4;
}

message MigrateVMResponse {
  bool success = 1;
  string error = 2;
}

message GetMigrationStatusRequest {
  string vm_name = 1;
}

message MigrationStatusResponse {
  string status = 1;
  int64 total_time_ms = 2;
  int64 downtime_ms = 3;
  int64 expected_downtime_ms = 4;
  double transferred_bytes = 5;
  double remaining_bytes = 6;
}

message CreateStoragePoolRequest {
  string name = 1;
  string type = 2;
  string path = 3;
  map<string, string> options = 4;
}

message StoragePoolResponse {
  StoragePool pool = 1;
  string error = 2;
}

message ListStoragePoolsRequest {}

message ListStoragePoolsResponse {
  repeated StoragePool pools = 1;
}

message DeleteStoragePoolRequest {
  string name = 1;
  bool force = 2;
}

message DeleteStoragePoolResponse {
  bool success = 1;
  string error = 2;
}

message StoragePool {
  string name = 1;
  string type = 2;
  string path = 3;
  int64 capacity_bytes = 4;
  int64 allocated_bytes = 5;
  int64 available_bytes = 6;
  bool active = 7;
}

message CreateTAPDeviceRequest {
  string name = 1;
  string bridge = 2;
  bool persistent = 3;
  string owner = 4;
  string group = 5;
  bool use_ovs = 6;
  string ovs_bridge = 7;
  int32 vlan_tag = 8;
  bool tag_trunk = 9;
}

message CreateBridgeRequest {
  string name = 1;
  repeated string interfaces = 2;
  string ip_address = 3;
  string netmask = 4;
  bool open_vswitch = 5;
  int32 vlan_tag = 6;
  repeated int32 trunks = 7;
  string ovs_bridge = 8;
}

message NetworkResponse {
  NetworkDevice device = 1;
  string error = 2;
}

message ListTAPDevicesRequest {}

message ListTAPDevicesResponse {
  repeated TAPDevice taps = 1;
}

message ListBridgesRequest {}

message ListBridgesResponse {
  repeated Bridge bridges = 1;
}

message DeleteTAPDeviceRequest {
  string name = 1;
}

message DeleteBridgeRequest {
  string name = 1;
}

message DeleteNetworkResponse {
  bool success = 1;
  string error = 2;
}

message TAPDevice {
  string name = 1;
  string bridge = 2;
  string mac_address = 3;
  bool persistent = 4;
  bool active = 5;
}

message Bridge {
  string name = 1;
  repeated string interfaces = 2;
  string ip_address = 3;
  string netmask = 4;
  bool active = 5;
}

message NetworkDevice {
  oneof device {
    TAPDevice tap = 1;
    Bridge bridge = 2;
    OVSBridge ovs_bridge = 3;
    OVSPort ovs_port = 4;
  }
}

message CreateOVSBridgeRequest {
  string name = 1;
  string parent = 2;
  bool internal = 3;
}

message DeleteOVSBridgeRequest {
  string name = 1;
}

message ListOVSBridgesRequest {}

message ListOVSBridgesResponse {
  repeated OVSBridge bridges = 1;
}

message AddOVSPortRequest {
  string bridge = 1;
  string port = 2;
  int32 vlan_tag = 3;
  repeated int32 trunks = 4;
}

message RemoveOVSPortRequest {
  string bridge = 1;
  string port = 2;
}

message ListOVSPortsRequest {
  string bridge = 1;
}

message ListOVSPortsResponse {
  repeated OVSPort ports = 1;
}

message OVSBridge {
  string name = 1;
  string parent = 2;
  bool internal = 3;
}

message OVSPort {
  string name = 1;
  string bridge = 2;
  int32 vlan_tag = 3;
  repeated int32 trunks = 4;
}

message CreateNetworkRequest {
  string name = 1;
  string subnet_cidr = 2;
  string gateway = 3;
  string dhcp_range_start = 4;
  string dhcp_range_end = 5;
  string dns_server = 6;
  int32 vlan_id = 7;
}

message CreateNetworkResponse {
  NetworkInfo network = 1;
  string error = 2;
}

message NetworkInfo {
  string name = 1;
  string bridge_name = 2;
  string subnet = 3;
  string gateway = 4;
  string dhcp_range = 5;
  string dns_server = 6;
  int32 vlan_id = 7;
}

message AttachVMToNetworkRequest {
  string vm_name = 1;
  string network_name = 2;
  string static_ip = 3;
}

message AttachVMToNetworkResponse {
  bool success = 1;
  NetworkInfo network_info = 2;
  string error = 3;
}

message EFIConfig {
  string loader_path = 1;
  string nvram_path = 2;
  string nvram_template = 3;
  bool secure_boot = 4;
}

enum HostEventType {
  HOST_EVENT_TYPE_UNSPECIFIED = 0;
  HOST_EVENT_TYPE_VM_CREATED = 1;
  HOST_EVENT_TYPE_VM_STARTED = 2;
  HOST_EVENT_TYPE_VM_STOPPED = 3;
  HOST_EVENT_TYPE_VM_CRASHED = 4;
  HOST_EVENT_TYPE_VM_PAUSED = 5;
  HOST_EVENT_TYPE_VM_RESUMED = 6;
  HOST_EVENT_TYPE_VM_DELETED = 7;
  HOST_EVENT_TYPE_HEARTBEAT = 20;
  HOST_EVENT_TYPE_HEALTH_DEGRADED = 21;
  HOST_EVENT_TYPE_HEALTH_FAILED = 22;
  HOST_EVENT_TYPE_RESOURCE_CPU_PRESSURE = 30;
  HOST_EVENT_TYPE_RESOURCE_MEM_PRESSURE = 31;
  HOST_EVENT_TYPE_RESOURCE_DISK_PRESSURE = 32;
  HOST_EVENT_TYPE_RESOURCE_REPORT = 40;
}

message SubscribeEventsRequest {}

message HostEvent {
  string id = 1;
  HostEventType type = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof payload {
    VmLifecycleEvent vm_lifecycle = 10;
    HostHealthEvent host_health = 11;
    ResourcePressureEvent resource_pressure = 12;
    HostResourceReport resource_report = 13;
  }
}

message VmLifecycleEvent {
  string vm_name = 1;
  string vm_uuid = 2;
  string previous_state = 3;
  string new_state = 4;
}

message HostHealthEvent {
  string check_name = 1;
  string status = 2;
  string message = 3;
}

message ResourcePressureEvent {
  string resource_type = 1;
  double threshold_percent = 2;
  double current_percent = 3;
  string details = 4;
}

message HostResourceReport {
  int32 physical_cpus = 1;
  int32 physical_cores = 2;
  int32 physical_threads = 3;
  string cpu_model = 4;
  int32 cpu_freq_mhz = 5;
  int64 memory_total_mb = 10;
  int64 memory_available_mb = 11;
  int64 memory_reserved_mb = 12;
  int64 memory_used_by_vms_mb = 13;
  repeated NUMANode numa_nodes = 20;
  bool kvm_available = 30;
  bool nested_virtualization = 31;
  bool vmx_svm_supported = 32;
  bool hugepages_available = 33;
  string qemu_version = 34;
  StorageSummary storage = 40;
}

message NUMANode {
  int32 node_id = 1;
  int64 memory_total_bytes = 2;
  repeated int32 cpu_core_ids = 3;
}

message StorageSummary {
  int64 pool_total_bytes = 1;
  int64 pool_used_bytes = 2;
  int64 pool_available_bytes = 3;
}

message ResourceSpec {
  int64 memory_limit_bytes = 1;
  int64 memory_reservation_bytes = 2;
  int64 cpu_shares = 3;
}