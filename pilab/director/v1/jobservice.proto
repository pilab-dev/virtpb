// =============================================================================
// Job Service - Job Status Tracking and Progress Updates
// =============================================================================
// Purpose: Enables agents to report job progress and status updates to the
// Director. Used for long-running operations that need progress tracking.
//
// Communication:
// - Unary RPC: Agent updates job status (UpdateJob)
// - Streaming: Director subscribes to job progress (Subscribe)
//
// Use Cases:
// - VM creation/deletion progress
// - Backup/restore operations
// - Migration progress
// - OVA export/import progress
// =============================================================================

syntax = "proto3";

package pilab.cloud.director.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/director/v1;directorv1";

// JobService is a service that allows the agent to update the status of a job.
service JobService {
    rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
    rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message Job {
    // JobID is the ID of the job.
    string job_id = 1;
    // JobStatus is the status of the job.
    string status = 2;
    // Message is the message of the job. Or the reason of the failure.
    string message = 3;
    // Progress is the progress of the job.
    uint32 progress = 4;
    // StartTime is the start time of the job.
    uint64 start_time = 5;
    // EndTime is the end time of the job.
    uint64 end_time = 6;
    // JobType is the type of the job.
    string job_type = 7;
    // VmId is the UUID of the VM.
    string vm_id = 8;
    // Params is the parameters of the job in JSON format.
    bytes params = 9;
}

// JobStreamRequest is a request to stream the status of a job.
message SubscribeRequest {
    // It can be empty because the director knows the agent from the certificate.
}

// JobStreamResponse is a response to stream the status of a job.
message SubscribeResponse {
    Job job = 1;
}

// UpdateJobRequest is a request to update the status of a job.
message UpdateJobRequest {
    // JobID is the ID of the job.
    string job_id = 1;
    // JobStatus is the status of the job.
    string status = 2;
    // Message is the message of the job. Or the reason of the failure.
    string message = 3;
    // Progress is the progress of the job.
    uint32 progress = 4;
}

// UpdateJobResponse is a response to update the status of a job.
message UpdateJobResponse {
}
