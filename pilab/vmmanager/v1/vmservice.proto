// =============================================================================
// VM Service - Simple VM Lifecycle Management
// =============================================================================
// Purpose: Provides a simplified VM management API focused on core lifecycle
// operations. Used as a basic VM management interface.
//
// Communication: Unary RPC for all operations
//
// Key Concepts:
// - VM: Basic virtual machine with CPU, memory, disks, network interfaces
// - VM State: Standard libvirt states (running, blocked, paused, shutdown, etc.)
// - Disk: Attached disks with format, size, bus type
// - Network Interface: Network attachments with MAC, model, type
// - Hardware Devices: PCI, USB, sound, graphics device management
//
// Note: This is a simplified API compared to agent/v1/vm_service. Provides
// the basic CRUD and control operations without advanced features like power
// scheduling, cloud-init, or TPM support.
// =============================================================================

syntax = "proto3";

package pilab.cloud.vmmanager.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/vmmanager/v1;vmmanagerv1";

// Service Definition
service VMService {
  // VM Lifecycle Management
  rpc CreateVM (CreateVMRequest) returns (VM) {}
  rpc GetVM (GetVMRequest) returns (VM) {}
  rpc ListVMs (ListVMsRequest) returns (ListVMsResponse) {}
  rpc StartVM (StartVMRequest) returns (google.protobuf.Empty) {}
  rpc StopVM (StopVMRequest) returns (google.protobuf.Empty) {}
  rpc RebootVM (RebootVMRequest) returns (google.protobuf.Empty) {}
  rpc SuspendVM (SuspendVMRequest) returns (google.protobuf.Empty) {}
  rpc ResumeVM (ResumeVMRequest) returns (google.protobuf.Empty) {}
  rpc ShutdownVM (ShutdownVMRequest) returns (google.protobuf.Empty) {}
  rpc DeleteVM (DeleteVMRequest) returns (google.protobuf.Empty) {}
  rpc UpdateVM (UpdateVMRequest) returns (VM) {}

  // Disk Management
  rpc AddDisk (AddDiskRequest) returns (Disk) {}
  rpc GetDisk (GetDiskRequest) returns (Disk) {}
  rpc ListDisks (ListDisksRequest) returns (ListDisksResponse) {}
  rpc RemoveDisk (RemoveDiskRequest) returns (google.protobuf.Empty) {}
  rpc ResizeDisk (ResizeDiskRequest) returns (google.protobuf.Empty) {}

  // Network Interface Management
  rpc AddNetworkInterface (AddNetworkInterfaceRequest) returns (NetworkInterface) {}
  rpc GetNetworkInterface (GetNetworkInterfaceRequest) returns (NetworkInterface) {}
  rpc ListNetworkInterfaces (ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse) {}
  rpc RemoveNetworkInterface (RemoveNetworkInterfaceRequest) returns (google.protobuf.Empty) {}
  rpc UpdateNetworkInterface (UpdateNetworkInterfaceRequest) returns (NetworkInterface) {}

  // Hardware management 
  rpc AddHardwareDevice (AddHardwareDeviceRequest) returns (HardwareDevice) {}
  rpc GetHardwareDevice (GetHardwareDeviceRequest) returns (HardwareDevice) {}
  rpc ListHardwareDevices (ListHardwareDevicesRequest) returns (ListHardwareDevicesResponse) {}
  rpc RemoveHardwareDevice (RemoveHardwareDeviceRequest) returns (google.protobuf.Empty) {}
  rpc UpdateHardwareDevice (UpdateHardwareDeviceRequest) returns (HardwareDevice) {}
}

// --- VM Messages ---

message VM {
  string uuid = 1;
  string name = 2;
  VMState state = 3;
  int32 memory_mb = 4;
  int32 vcpus = 5;
  repeated Disk disks = 6;
  repeated NetworkInterface network_interfaces = 7;
  repeated HardwareDevice hardware_devices = 8;
  google.protobuf.Timestamp creation_time = 9;
  string os_type = 10;
  string firmware = 11; // e.g., "bios", "uefi"
}

enum VMState {
  NOSTATE = 0;    // The domain is not running
  RUNNING = 1;    // The domain is running
  BLOCKED = 2;    // The domain is blocked on resource
  PAUSED = 3;     // The domain is paused by user
  SHUTDOWN = 4;   // The domain is being shut down
  SHUTOFF = 5;    // The domain is shut off
  CRASHED = 6;    // The domain is crashed
  PMSUSPENDED = 7; // The domain is suspended by guest power management
}

message CreateVMRequest {
  string name = 1;
  int32 memory_mb = 2;
  int32 vcpus = 3;
  string os_type = 4;
  string firmware = 5; // e.g., "bios", "uefi"
  repeated Disk disks = 6;
  repeated NetworkInterface network_interfaces = 7;
}

message GetVMRequest {
  string uuid = 1;
}

message ListVMsRequest {
  // Add filters (optional) like state, name, etc.
}

message ListVMsResponse {
  repeated VM vms = 1;
}

message StartVMRequest {
  string uuid = 1;
}

message StopVMRequest {
  string uuid = 1;
  bool force = 2; // Force stop (power off)
}

message RebootVMRequest {
  string uuid = 1;
  bool force = 2;
}

message SuspendVMRequest {
  string uuid = 1;
}

message ResumeVMRequest {
  string uuid = 1;
}

message ShutdownVMRequest {
  string uuid = 1;
}

message DeleteVMRequest {
  string uuid = 1;
}

message UpdateVMRequest {
  string uuid = 1;
  string name = 2;
  int32 memory_mb = 3;
  int32 vcpus = 4;
  string os_type = 5;
}

// --- Disk Messages ---

message Disk {
  string uuid = 1; // Unique ID for the disk
  string vm_uuid = 2; // UUID of the VM the disk belongs to
  string path = 3; // Path to the disk image file (e.g., /path/to/disk.qcow2)
  string format = 4; // Format of the disk (e.g., qcow2, raw)
  int64 size_gb = 5; // Size of the disk in GB
  string type = 6; // e.g., "disk", "cdrom"
  string bus = 7; // e.g., "virtio", "scsi", "sata", "usb"
  string source_type = 8; // e.g., "file", "block" (for block devices)
  string device = 9; // e.g., "vda", "hda", "sda"
  string target = 10; // Target device inside the VM
}

message AddDiskRequest {
  string vm_uuid = 1;
  string path = 2; 
  string format = 3;
  int64 size_gb = 4;
  string type = 5;
  string bus = 6;
  string source_type = 7;
  string target = 8;
}

message GetDiskRequest {
  string uuid = 1;
}

message ListDisksRequest {
  string vm_uuid = 1; // Optional: Filter disks by VM UUID
}

message ListDisksResponse {
  repeated Disk disks = 1;
}

message RemoveDiskRequest {
  string uuid = 1;
}

message ResizeDiskRequest {
  string uuid = 1;
  int64 new_size_gb = 2;
}

// --- Network Interface Messages ---

message NetworkInterface {
  string uuid = 1;
  string vm_uuid = 2;
  string mac_address = 3;
  string network_name = 4; // Name of the virtual network (bridge)
  string model = 5;      // e.g., virtio, e1000
  string interface_type = 6; // e.g., "bridge", "nat", "routed", "hostdev"
  string source = 7; // e.g., bridge name or physical interface for passthrough
  string target = 8; // Target device name inside the VM (e.g., "eth0")
  string script_path = 9; // Path to a custom network script
}

message AddNetworkInterfaceRequest {
  string vm_uuid = 1;
  string network_name = 2;
  string model = 3;
  string interface_type = 4;
  string source = 5;
  string target = 6;
  string script_path = 7;
}

message GetNetworkInterfaceRequest {
  string uuid = 1;
}

message ListNetworkInterfacesRequest {
  string vm_uuid = 1; // Optional: Filter by VM UUID
}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface network_interfaces = 1;
}

message RemoveNetworkInterfaceRequest {
  string uuid = 1;
}

message UpdateNetworkInterfaceRequest {
  string uuid = 1;
  string mac_address = 2;
  string network_name = 3;
  string model = 4;
}

// --- Hardware Device Messages ---

message HardwareDevice {
  string uuid = 1;
  string vm_uuid = 2;
  string type = 3; // e.g., "pci", "usb", "sound", "graphics"
  string managed = 4; // e.g., "yes", "no" - whether libvirt manages the device
  map<string, string> attributes = 5; // Key-value pairs for device-specific attributes
}

message AddHardwareDeviceRequest {
  string vm_uuid = 1;
  string type = 2;
  string managed = 3;
  map<string, string> attributes = 4;
}

message GetHardwareDeviceRequest {
  string uuid = 1;
}

message ListHardwareDevicesRequest {
  string vm_uuid = 1; // Optional: Filter by VM UUID
}

message ListHardwareDevicesResponse {
  repeated HardwareDevice hardware_devices = 1;
}

message RemoveHardwareDeviceRequest {
  string uuid = 1;
}

message UpdateHardwareDeviceRequest {
  string uuid = 1;
  map<string, string> attributes = 2;
}