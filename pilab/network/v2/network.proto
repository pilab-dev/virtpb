  PROTOCOL_ICMPV6 = 5;
  PROTOCOL_SCTP = 6;
  PROTOCOL_GRE = 7;
  PROTOCOL_VXLAN = 8;
  PROTOCOL_ESP = 9;
  PROTOCOL_AH = 10;
}

