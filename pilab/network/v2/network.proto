message DeleteSecurityProfileRequest { string security_profile_id = 1; }

message ApplySecurityProfileRequest {
  string security_profile_id = 1;
  string port_id = 2;
}

message RemoveSecurityProfileRequest { string port_id = 1; }

message AddACLRuleRequest {
  string security_profile_id = 1;
  ACLRule rule = 2;
}

message UpdateACLRuleRequest {
  string security_profile_id = 1;
  ACLRule rule = 2;
