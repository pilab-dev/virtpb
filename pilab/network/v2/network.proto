service PublicIPService {
  rpc AllocatePublicIP(AllocatePublicIPRequest) returns (PublicIP);
  rpc GetPublicIP(GetPublicIPRequest) returns (PublicIP);
  rpc ListPublicIPs(ListPublicIPsRequest) returns (ListPublicIPsResponse);
  rpc ReleasePublicIP(ReleasePublicIPRequest) returns (Empty);
  rpc AssociatePublicIP(AssociatePublicIPRequest) returns (PublicIP);
  rpc DisassociatePublicIP(DisassociatePublicIPRequest) returns (Empty);

  rpc CreatePortForward(CreatePortForwardRequest) returns (PortForward);
  rpc UpdatePortForward(UpdatePortForwardRequest) returns (PortForward);
  rpc DeletePortForward(DeletePortForwardRequest) returns (Empty);
  rpc ListPortForwards(ListPortForwardsRequest) returns (ListPortForwardsResponse);

  rpc CreateFirewallProfile(CreateFirewallProfileRequest) returns (FirewallProfile);
  rpc GetFirewallProfile(GetFirewallProfileRequest) returns (FirewallProfile);
  rpc UpdateFirewallProfile(UpdateFirewallProfileRequest) returns (FirewallProfile);
  rpc DeleteFirewallProfile(DeleteFirewallProfileRequest) returns (Empty);
  rpc AddFirewallRule(AddFirewallRuleRequest) returns (FirewallRule);
  rpc UpdateFirewallRule(UpdateFirewallRuleRequest) returns (FirewallRule);
