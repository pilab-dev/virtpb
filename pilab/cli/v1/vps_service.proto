// ============================================================================
// OS Template Messages (from osinfodb)
// ============================================================================

message OSTemplate {
  string id = 1;                    // Short ID (e.g., "ubuntu22.04")
  string os_id = 2;                // Full OS ID (e.g., "http://ubuntu.com/ubuntu/22.04")
  string name = 3;                  // Sanitized name (e.g., "ubuntu-22.04")
  string full_name = 4;             // Full name (e.g., "Ubuntu 22.04 LTS")
  string family = 5;               // OS family (linux, windows, bsd)
  string vendor = 6;                // Vendor (Canonical, Red Hat, Microsoft)
  string version = 7;              // Version string
  string architecture = 8;         // Architecture (x86_64, aarch64, etc.)
  int32 cpu_cores = 9;             // Recommended CPU cores
  int32 memory_mb = 10;            // Recommended memory in MB
  int32 disk_gb = 11;              // Recommended disk size in GB
  bool cloud_init = 12;            // Supports cloud-init
  repeated ImageURL image_urls = 13; // Available image download URLs
  map<string, string> labels = 14; // Labels for filtering
  OSTemplateState state = 15;      // Template state
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

enum OSTemplateState {
  OSTEMPLATE_STATE_UNSPECIFIED = 0;
  OSTEMPLATE_STATE_CREATING = 1;
  OSTEMPLATE_STATE_READY = 2;
  OSTEMPLATE_STATE_ERROR = 3;
  OSTEMPLATE_STATE_SYNCING = 4;
}

message ImageURL {
  string url = 1;                  // Download URL
  string type = 2;                 // "iso", "disk", "containerdisk"
  string format = 3;               // "qcow2", "raw", "vmdk"
  string variant_id = 4;           // Variant identifier
  bool cloud_init = 5;            // Supports cloud-init
}

message ListOSTemplatesRequest {
  string family = 1;               // Filter by OS family (linux, windows, bsd)
  string vendor = 2;              // Filter by vendor
  string architecture = 3;         // Filter by architecture
  bool cloud_init_only = 4;       // Only show cloud-init supported
  int32 page_size = 5;
  string page_token = 6;
}

message ListOSTemplatesResponse {
  repeated OSTemplate templates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetOSTemplateRequest {
  string os_id = 1;                // Can be full ID, short ID, or name
}

message SyncOSTemplatesRequest {
  bool force = 1;                  // Force re-sync even if templates exist
}

message SyncOSTemplatesResponse {
  int32 imported_count = 1;
  google.protobuf.Timestamp synced_at = 2;
}

message CreateVMFromOSTemplateRequest {
  string name = 1;                 // VM name
  string os_id = 2;               // OS template ID (full ID, short ID, or name)
  int32 cpu_cores = 3;            // Override recommended CPU (0 = use template default)
  int32 memory_mb = 4;           // Override recommended memory (0 = use template default)
  int32 root_disk_size_gb = 5;    // Override recommended disk size (0 = use template default)
  string password = 6;             // Initial password
  repeated string ssh_keys = 7;   // SSH keys for access
  string userdata = 8;             // Cloud-init userdata
  string boot_order = 9;           // Boot device order
  string description = 10;         // VM description
  map<string, string> labels = 11;
  bool preemptible = 12;
  bool auto_restart_on_maintenance = 13;
  string zone = 14;                // Availability zone
  repeated string private_networks = 15;
  string public_ip = 16;
  repeated string security_groups = 17;
  string machine_type = 18;        // Override machine type
  map<string, string> metadata = 19;
  bool wait = 20;
}

