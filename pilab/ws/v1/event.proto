// =============================================================================
// WebSocket Event Service - Real-Time Event Streaming
// =============================================================================
// Purpose: Provides WebSocket-based real-time event streaming for clients.
// Used for live updates of job progress, VM state changes, metrics.
//
// Communication: WebSocket bidirectional streaming
//
// Event Types:
// - JobCreated: New job/operation started
// - JobCompleted: Job finished successfully
// - JobFailed: Job failed with error
// - VmEvent: VM state change events
// - HostStats: Host resource utilization updates
// - VmMetrics: VM performance metrics updates
//
// Client Messages:
// - SubscribeMessage: Subscribe/unsubscribe to events (by job ID or VM ID)
// - AuthenticateMessage: WebSocket authentication
// =============================================================================

syntax = "proto3";

package pilab.ws.v1;

import "pilab/vm_metrics.proto";
import "pilab/host_stats.proto";
import "pilab/job_status.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/ws/v1;wsv1";

message JobCreated {
  string job = 1;
  string job_name = 2;
  string resource_type = 3;
  string resource_id = 4;
}

message JobCompleted {
  string job = 1;
  string message = 2;
}

message JobFailed {
  string job = 1;
  string message = 2;
}

message JobList {
  repeated JobStatus jobs = 1;
}

message VmEvent {
  string vm_id = 1;
  string event = 2;
  string detail = 3;
  string state = 4;
}

// Receiving events
message Event {
  oneof payload {
    JobStatus job_status = 1;
    JobCreated job_created = 2;
    JobCompleted job_completed = 3;
    JobFailed job_failed = 4;
    VmEvent vm_event = 5;
    HostStats host_stats_event = 6;
    VmMetrics vm_metrics = 7;
  }
}


// Outbound messages
message SubscribeMessage {
  oneof payload {
    string job = 1;
    string vm_id = 2;
  }
  optional bool unsubscribe = 3;
}

message AuthenticateMessage {
  string token = 1;
}

message JobListRequest {
}

// Sending requests
message Requests {
  oneof payload {
    SubscribeMessage subscribe = 1;
    AuthenticateMessage authenticate = 2;
  }
}