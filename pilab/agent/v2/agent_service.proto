// =============================================================================
// Agent Service v2 - Enhanced Agent with Content Library and OVA Support
// =============================================================================
// Purpose: Enhanced version of agent service with content library management,
// OVA import/export, and more comprehensive VM configuration options.
//
// Communication: Mix of unary RPC and streaming (for OVA)
//
// New Features over v1:
// - Content Library: Manage ISOs, templates in central storage
// - OVA Export: Stream VM to OVA file (server -> client)
// - OVA Import: Import VM from OVA file (client -> server)
// - Datastore Management: Create/delete datastores on hosts
// - Enhanced VM Config: More detailed CPU (topology, pinning, NUMA), memory,
//   disk, network configuration
// - Task Management: Track and cancel long-running tasks
// - Host Configuration: Network, storage, time configuration
// - Maintenance Mode: Enter/exit with VM evacuation
// =============================================================================

syntax = "proto3";

package pilab.cloud.agent.v2;

option go_package = "go.pilab.hu/cloud/virtpb/agent/v2;agentv2";

import "google/protobuf/empty.proto";

// Agent service definition.
service AgentService {
  // Host Management
  rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse) {}
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}
  rpc GetHostStatus(GetHostStatusRequest) returns (HostStatus) {}

  // VM Management
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse) {}
  rpc GetVMDetails(GetVMDetailsRequest) returns (GetVMDetailsResponse) {}
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse) {}
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse) {}
  rpc StartVM(StartVMRequest) returns (StartVMResponse) {}
  rpc StopVM(StopVMRequest) returns (StopVMResponse) {}
  rpc ForceStopVM(ForceStopVMRequest) returns (ForceStopVMResponse) {}
  rpc RebootVM(RebootVMRequest) returns (RebootVMResponse) {}
  rpc PauseVM(PauseVMRequest) returns (PauseVMResponse) {}
  rpc ResumeVM(ResumeVMRequest) returns (ResumeVMResponse) {}
  rpc InitiateMigration(InitiateMigrationRequest)
      returns (InitiateMigrationResponse) {}
  rpc PrepareForMigration(PrepareForMigrationRequest)
      returns (PrepareForMigrationResponse) {}
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse) {}
  rpc RevertToSnapshot(RevertToSnapshotRequest)
      returns (RevertToSnapshotResponse) {}
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {}

  // Task Management
  rpc GetTaskStatus(GetTaskStatusRequest) returns (Task) {}
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse) {}

  // Configuration Management (Host-level)
  rpc ConfigureNetwork(ConfigureNetworkRequest)
      returns (ConfigureNetworkResponse) {}
  rpc ConfigureStorage(ConfigureStorageRequest)
      returns (ConfigureStorageResponse) {}
  rpc ConfigureTime(ConfigureTimeRequest) returns (ConfigureTimeResponse) {}
  rpc SetMaintenanceMode(SetMaintenanceModeRequest)
      returns (SetMaintenanceModeResponse) {}
  rpc UpdateHost(UpdateHostRequest) returns (UpdateHostResponse) {}

  // Retrieves a list of available items in the content library.
  rpc GetContentLibraryItems(GetContentLibraryItemsRequest)
      returns (GetContentLibraryItemsResponse) {}

  // Uploads an item to the content library.
  rpc UploadContentLibraryItem(stream UploadContentLibraryItemRequest)
      returns (UploadContentLibraryItemResponse) {}

  // Exports a VM to OVA format (server streams bytes to client).
  rpc ExportOVA(ExportOVARequest) returns (stream ExportOVAResponse) {}

  // Imports a VM from OVA format (client streams bytes to server).
  rpc ImportOVA(stream ImportOVARequest) returns (ImportOVAResponse) {}

  // Deletes an item from the content library.
  rpc DeleteContentLibraryItem(DeleteContentLibraryItemRequest)
      returns (DeleteContentLibraryItemResponse) {}

  // Retrieves a list of available datastores.
  rpc GetDatastores(GetDatastoresRequest) returns (GetDatastoresResponse) {}

  // Retrieves details about a specific datastore.
  rpc GetDatastore(GetDatastoreRequest) returns (GetDatastoreResponse) {}

  // Creates a new datastore.
  rpc CreateDatastore(CreateDatastoreRequest)
      returns (CreateDatastoreResponse) {}

  // Deletes a datastore.
  rpc DeleteDatastore(DeleteDatastoreRequest)
      returns (DeleteDatastoreResponse) {}

  // Retrieves a list of available networks.
  rpc GetNetworks(GetNetworksRequest) returns (GetNetworksResponse) {}

  // Retrieves details about a specific network.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse) {}

  // Creates a new network.
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse) {}

  // Deletes a network.
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse) {}

  // Attaches an ISO image from the content library to a VM.
  rpc AttachIso(AttachIsoRequest) returns (AttachIsoResponse) {}

  // Detaches an ISO image from a VM.
  rpc DetachIso(DetachIsoRequest) returns (DetachIsoResponse) {}

  // Clones a VM from a template in the content library.
  rpc CloneVmFromTemplate(CloneVmFromTemplateRequest)
      returns (CloneVmFromTemplateResponse) {}

  // Extended VM Operations (from v1)
  // Get IP addresses of a VM via qemu-guest-agent
  rpc GetVMGuestIPs(GetVMGuestIPsRequest) returns (GetVMGuestIPsResponse) {}
  // Change password of a user inside the VM via qemu-guest-agent
  rpc ChangeVMUserPassword(ChangeVMUserPasswordRequest) returns (ChangeVMUserPasswordResponse) {}
  // Attach cloud-init ISO to a VM
  rpc AttachCloudInit(AttachCloudInitRequest) returns (AttachCloudInitResponse) {}
  // Attach a network interface to a VM
  rpc AttachNetworkInterface(AttachNetworkInterfaceRequest) returns (AttachNetworkInterfaceResponse) {}
  // Detach a network interface from a VM
  rpc DetachNetworkInterface(DetachNetworkInterfaceRequest) returns (DetachNetworkInterfaceResponse) {}

  // VNC/SPICE terminal streaming
  rpc Stream(stream StreamRequest) returns (stream StreamResponse) {}

  // Hardware monitoring
  rpc GetHardwareHealth(GetHardwareHealthRequest) returns (GetHardwareHealthResponse) {}
  rpc GetSensorData(GetSensorDataRequest) returns (GetSensorDataResponse) {}

  // VM Definition (low-level libvirt operations)
  rpc DefineVM(DefineVMRequest) returns (DefineVMResponse) {}
  rpc GetVMDefinition(GetVMDefinitionRequest) returns (GetVMDefinitionResponse) {}
  rpc ControlVM(ControlVMRequest) returns (ControlVMResponse) {}
  rpc GetVMStatus(GetVMStatusRequest) returns (GetVMStatusResponse) {}
  rpc GetVMGuestInfo(GetVMGuestInfoRequest) returns (GetVMGuestInfoResponse) {}

  // Power Scheduling
  rpc CreatePowerSchedule(CreatePowerScheduleRequest) returns (CreatePowerScheduleResponse) {}
  rpc ListPowerSchedules(ListPowerSchedulesRequest) returns (ListPowerSchedulesResponse) {}
  rpc UpdatePowerSchedule(UpdatePowerScheduleRequest) returns (UpdatePowerScheduleResponse) {}
  rpc DeletePowerSchedule(DeletePowerScheduleRequest) returns (DeletePowerScheduleResponse) {}

  // Wake-on-LAN
  rpc WakeOnLAN(WakeOnLANRequest) returns (WakeOnLANResponse) {}
}

// Represents a generic task.
message Task {
  string task_id = 1;
  string status = 2;    // e.g., "pending", "running", "success", "failed"
  float progress = 3;   // 0.0 to 1.0, if applicable
  int64 start_time = 4; // Unix timestamp
  int64 end_time = 5;   // Unix timestamp
  string error = 6;     // Error message, if any
}

// Represents CPU topology.
message CPUTopology {
  uint32 sockets = 1;
  uint32 cores = 2;
  uint32 threads = 3;
}

// Represents CPU pinning.
message CPUPinning {
  uint32 vcpu = 1;
  string cpuset = 2;
}

// Represents NUMA affinity for CPU or memory.
message NUMAAffinity {
  uint32 node = 1;
  string cpus = 2;    // For CPU affinity, e.g., "0-1"
  string memory = 3;  // For memory affinity, e.g., "2048M"
  uint64 size_mb = 4; // For memory affinity, indicating size in MB
}

// Represents CPU configuration.
message CPU {
  uint32 vcpus = 1;
  CPUTopology topology = 2;
  repeated CPUPinning pinning = 3;
  string mode = 4;
  repeated string feature_flags = 5;
  repeated NUMAAffinity numa_affinity = 6;
}

// Represents memory configuration.
message Memory {
  uint64 allocated_mb = 1;
  bool ballooning = 2;
  bool huge_pages = 3;
  repeated NUMAAffinity numa_affinity = 4;
}

// Represents QoS settings for disk or network interface.
message QOSSettings {
  uint64 read_iops = 1;
  uint64 write_iops = 2;
  string ingress_bandwidth = 3;
  string egress_bandwidth = 4;
}

// Represents disk encryption settings.
message DiskEncryption { bool enabled = 1; }

// Represents a disk.
message Disk {
  string id = 1;
  string datastore = 2;
  string format = 3;
  uint64 size_gb = 4;
  string bus = 5;
  uint64 iops_limit = 6;
  QOSSettings qos_settings = 7;
  DiskEncryption encryption = 8;
  string backing_file = 9;
}

// Represents a storage adapter.
message StorageAdapter {
  string type = 1;
  uint32 controllers = 2;
  string controller_type = 3;
}

// Represents storage configuration.
message Storage {
  repeated Disk disks = 1;
  repeated StorageAdapter adapters = 2;
}

// Represents a network interface.
message NetworkInterface {
  string id = 1;
  string virtual_network = 2;
  string mac_address = 3;
  string model = 4;
  QOSSettings qos_settings = 5;
  string pci_passthrough = 6;
}

// Represents network configuration.
message Network { repeated NetworkInterface interfaces = 1; }

// Represents BIOS configuration.
message BIOS {
  string type = 1;
  repeated string boot_order = 2;
  bool secure_boot = 3;
  bool vtpm = 4;
}

// Represents input devices.
message InputDevice {
  string type = 1; // e.g. "usb", "ps2"
}

message Input {
  InputDevice keyboard = 1;
  InputDevice mouse = 2;
  repeated string usb_passthrough_devices = 3;
  repeated SerialPort serial_ports = 4;
  repeated string parallel_ports = 5;
}

message SerialPort { string device = 1; }

// Represents video configuration.
message Video {
  string adapter = 1;
  uint32 vram_mb = 2;
  bool acceleration_3d = 3;
}

// Represents QoS limits for a specific disk.
message DiskQOSLimit {
  string disk_id = 1;
  uint64 read_iops = 2;
  uint64 write_iops = 3;
}

// Represents QoS limits for a specific network interface.
message NetworkQOSLimit {
  string interface_id = 1;
  string ingress_bandwidth = 2;
  string egress_bandwidth = 3;
}

// Represents overall QoS configuration.
message QoS {
  uint32 cpu_shares = 1;
  uint64 memory_limit_mb = 2;
  repeated DiskQOSLimit disk_limits = 3;
  repeated NetworkQOSLimit network_limits = 4;
}

// Represents a virtual machine.
message VirtualMachine {
  string id = 1;
  string name = 2;
  string description = 3;
  string os_type = 4;
  string os_version = 5;
  CPU cpu = 6;
  Memory memory = 7;
  Storage storage = 8;
  Network network = 9;
  BIOS bios = 10;
  Input input = 11;
  Video video = 12;
  QoS qos = 13;
  map<string, string> metadata = 14;
}

// Represents host status metrics.
message HostStatus {
  float cpu_load = 1;
  uint64 memory_usage_mb = 2;
  float network_utilization = 3;
  float storage_utilization = 4;
  uint64 uptime = 5; // Seconds
  map<string, string> metadata = 6;
}

message CloneVMImageFromMinioRequest {
  string minio_bucket = 1;
  string minio_object = 2;
}

message CloneVMImageFromMinioResponse { string message = 1; }

// Host Management Messages
message RegisterHostRequest {
  string director_address = 1;
  string ip_address = 2;
  string username = 4; // Or other authentication credentials
  string password = 5;
  map<string, string> metadata = 6;
}

message RegisterHostResponse {
  string host_id = 1;
  string message = 2;
  string agent_welcome = 3;
}

message HeartbeatRequest { string host_id = 1; }

message HeartbeatResponse {
  string status = 1;       // "OK", "MAINTENANCE", etc.
  repeated Task tasks = 2; // New tasks assigned by the Orchestrator
}

message GetHostStatusRequest { string host_id = 1; }

// VM Management Messages
message CreateVMRequest { VirtualMachine vm = 1; }

message CreateVMResponse {
  string vm_id = 1;
  string message = 2;
}

message GetVMDetailsRequest { string vm_id = 1; }

message GetVMDetailsResponse { VirtualMachine vm = 1; }

message UpdateVMRequest {
  string vm_id = 1;
  VirtualMachine vm_object = 2; // Update the whole VM object
}

message UpdateVMResponse { google.protobuf.Empty message = 1; }

message DeleteVMRequest { string vm_id = 1; }

message DeleteVMResponse { google.protobuf.Empty message = 1; }

message StartVMRequest { string vm_id = 1; }

message StartVMResponse { google.protobuf.Empty message = 1; }

message StopVMRequest { string vm_id = 1; }

message StopVMResponse { google.protobuf.Empty message = 1; }

message ForceStopVMRequest { string vm_id = 1; }
message ForceStopVMResponse { google.protobuf.Empty message = 1; }

message RebootVMRequest { string vm_id = 1; }

message RebootVMResponse { google.protobuf.Empty message = 1; }

message PauseVMRequest { string vm_id = 1; }

message PauseVMResponse { google.protobuf.Empty message = 1; }

message ResumeVMRequest { string vm_id = 1; }

message ResumeVMResponse { google.protobuf.Empty message = 1; }

message InitiateMigrationRequest {
  string vm_id = 1;
  string target_host = 2;
}

message InitiateMigrationResponse { google.protobuf.Empty message = 1; }

message PrepareForMigrationRequest {
  string vm_id = 1;
  string source_host = 2;
}

message PrepareForMigrationResponse { google.protobuf.Empty message = 1; }

message CreateSnapshotRequest {
  string vm_id = 1;
  string snapshot_name = 2;
  string description = 3;
  bool include_memory = 4;
}

message CreateSnapshotResponse {
  string snapshot_id = 1;
  string message = 2;
}

message RevertToSnapshotRequest {
  string vm_id = 1;
  string snapshot_id = 2;
}

message RevertToSnapshotResponse { google.protobuf.Empty message = 1; }

message DeleteSnapshotRequest {
  string vm_id = 1;
  string snapshot_id = 2;
}

message DeleteSnapshotResponse { google.protobuf.Empty message = 1; }

// Task Management Messages
message GetTaskStatusRequest { string task_id = 1; }

message CancelTaskRequest { string task_id = 1; }

message CancelTaskResponse { google.protobuf.Empty message = 1; }

// Configuration Management Messages
message ConfigureNetworkRequest {
  string host_id = 1;
  // ... network configuration details (e.g., enable/disable interfaces, OVS
  // settings)
  oneof config_type {
    NetworkInterface network_interface = 2;
    string ovs_config = 3;
    // other network-specific config
  }
}

message ConfigureNetworkResponse { google.protobuf.Empty message = 1; }

message ConfigureStorageRequest {
  string host_id = 1;
  // ... storage configuration details (e.g., LVM, NFS, iSCSI)
  oneof config_type {
    LVMVolume lvm_volume = 2;
    NFSShare nfs_share = 3;
    ISCSITarget iscsi_target = 4;
  }
}

message ConfigureStorageResponse { google.protobuf.Empty message = 1; }

message ConfigureTimeRequest {
  string host_id = 1;
  // ... time configuration details (e.g., NTP servers, timezone)
  oneof config_type {
    string ntp_server = 2;
    string timezone = 3;
  }
}

message ConfigureTimeResponse { google.protobuf.Empty message = 1; }

message SetMaintenanceModeRequest {
  string host_id = 1;
  bool enter_maintenance = 2; // true to enter, false to exit
  bool evacuate_vms = 3; // Whether to evacuate VMs before entering maintenance
}

message SetMaintenanceModeResponse { google.protobuf.Empty message = 1; }

message UpdateHostRequest { string host_id = 1; }

message UpdateHostResponse { google.protobuf.Empty message = 1; }

// Additional messages for config types
message LVMVolume {
  string vg_name = 1;
  string lv_name = 2;
  string size = 3; // e.g., "10G"
  // ... other LVM properties
}

message NFSShare {
  string server = 1;
  string path = 2;
  string mount_point = 3;
  // ... other NFS properties
}

message ISCSITarget {
  string portal = 1;
  string target = 2;
  string lun = 3;
}

// Content Library Management
message GetContentLibraryItemsRequest {
  // Filter criteria (optional).
  message Filter {
    string type = 1;              // "iso", "template", etc.
    string name = 2;              // Filter by name (can include wildcards).
    map<string, string> tags = 3; // Filter by tags (key-value pairs).
  }
  Filter filter = 1;

  // Pagination (optional).
  int32 page_size = 2;
  string page_token = 3;
}

message GetContentLibraryItemsResponse {
  message ContentLibraryItem {
    string id = 1; // Unique identifier of the item.
    string name = 2;
    string type = 3;              // "iso", "template", etc.
    int64 size = 4;               // Size of the item in bytes.
    string created_at = 5;        // Timestamp of creation.
    string updated_at = 6;        // Timestamp of last update.
    map<string, string> tags = 7; // Tags associated with the item.
    string checksum = 8; // Checksum of the item for integrity verification.
  }
  repeated ContentLibraryItem items = 1;

  // Pagination (optional).
  string next_page_token = 2;
}

message UploadContentLibraryItemRequest {
  oneof request {
    ContentLibraryItemInfo metadata = 1;
    bytes chunk_data = 2;
  }
}

message ContentLibraryItemInfo {
  string name = 1;
  string type = 2; // "iso", "template"
  map<string, string> tags = 3;
}

message UploadContentLibraryItemResponse {
  string id = 1;       // Unique identifier of the uploaded item.
  string checksum = 2; // Checksum of the uploaded item.
  Error error = 3;
}

message DeleteContentLibraryItemRequest {
  string id = 1; // Unique identifier of the item to delete.
}

message DeleteContentLibraryItemResponse { Error error = 1; }

// Datastore Management

message GetDatastoresRequest {
  // Pagination (optional).
  int32 page_size = 1;
  string page_token = 2;
}

message GetDatastoresResponse {
  message Datastore {
    string id = 1; // Unique identifier of the datastore.
    string name = 2;
    string type = 3;              // "lvm", "nfs", "directory", "iscsi", "ceph"
    int64 total_capacity = 4;     // Total capacity in bytes.
    int64 available_capacity = 5; // Available capacity in bytes.
    repeated string supported_formats = 6; // "qcow2", "raw", etc.
    bool is_local = 7; // Indicates whether the datastore is local to the host.
    // Connection details (e.g., server address, path for NFS).
    map<string, string> connection_info = 8;
  }
  repeated Datastore datastores = 1;

  // Pagination (optional).
  string next_page_token = 2;
}

message GetDatastoreRequest {
  string id = 1; // Unique identifier of the datastore.
}

message GetDatastoreResponse {
  message Datastore {
    string id = 1; // Unique identifier of the datastore.
    string name = 2;
    string type = 3;              // "lvm", "nfs", "directory", "iscsi", "ceph"
    int64 total_capacity = 4;     // Total capacity in bytes.
    int64 available_capacity = 5; // Available capacity in bytes.
    repeated string supported_formats = 6; // "qcow2", "raw", etc.
    bool is_local = 7; // Indicates whether the datastore is local to the host.
    map<string, string> connection_info =
        8; // Connection details (e.g., server address, path for NFS).
  }
  Datastore datastore = 1;
  Error error = 2;
}

message CreateDatastoreRequest {
  string name = 1;
  string type = 2; // "lvm", "nfs", "directory"
  // Connection details (e.g., server address, path for NFS, device path
  map<string, string> connection_info = 3;
  // for lvm).
  // Other parameters specific to the datastore type (e.g., LVM volume group
  // name).
  // ...
}

message CreateDatastoreResponse {
  string id = 1; // Unique identifier of the created datastore.
  Error error = 2;
}

message DeleteDatastoreRequest {
  string id = 1; // Unique identifier of the datastore to delete.
}

message DeleteDatastoreResponse { Error error = 1; }

// Network Management

message GetNetworksRequest {
  // Pagination (optional).
  int32 page_size = 1;
  string page_token = 2;
}

message NetworkDefinition {
  string id = 1; // Unique identifier of the network.
  string name = 2;
  string type = 3;        // "bridge", "ovs"
  string bridge_name = 4; // Name of the bridge device (if applicable).
  map<string, string> connection_info = 5; // For example: DHCP ranges, etc
}

message GetNetworksResponse {
  repeated NetworkDefinition networks = 1;

  // Pagination (optional).
  string next_page_token = 2;
}

message GetNetworkRequest {
  string id = 1; // Unique identifier of the network.
}

message GetNetworkResponse {
  NetworkDefinition network = 1;
  Error error = 2;
}

message CreateNetworkRequest {
  string name = 1;
  string type = 2;        // "bridge", "ovs"
  string bridge_name = 3; // Name of the bridge device (if applicable).
  // Other parameters specific to the network type (e.g., VLAN ID for OVS).
  // ...
}

message CreateNetworkResponse {
  string id = 1; // Unique identifier of the created network.
  Error error = 2;
}

message DeleteNetworkRequest {
  string id = 1; // Unique identifier of the network to delete.
}

message DeleteNetworkResponse { Error error = 1; }

message AttachIsoRequest {
  string vm_id = 1;
  string iso_id = 2; // from content library item
}

message AttachIsoResponse { Error error = 1; }

message DetachIsoRequest {
  string vm_id = 1;
  string iso_id = 2; // from content library item
}

message DetachIsoResponse { Error error = 1; }

message CloneVmFromTemplateRequest {
  string template_id = 1;
  string vm_name = 2;
  string datastore_id = 3;
  map<string, string> vm_overrides =
      4; // Allows overriding certain VM properties from the template, like CPU,
  // memory, etc.
}

message CloneVmFromTemplateResponse {
  string vm_id = 1;
  Error error = 2;
}

message Error {
  string code = 1;
  string message = 2;
  string details = 3;
}

// OVA Export Messages
message ExportOVARequest {
  string vm_id = 1; // ID of the VM to export
  string datastore_id = 2; // Optional: Datastore to use for temporary storage
}

message ExportOVAResponse {
  bytes chunk_data = 1; // Chunk of OVA file data
  float progress = 2; // Progress (0.0 to 1.0)
  string filename = 3; // Optional: Filename for the OVA file
}

// OVA Import Messages
message ImportOVARequest {
  oneof request {
    ImportOVAInfo metadata = 1; // Metadata about the OVA to import
    bytes chunk_data = 2; // Chunk of OVA file data
  }
}

message ImportOVAInfo {
  string vm_name = 1; // Name to give the imported VM
  string datastore_id = 2; // Datastore to store the VM
  string description = 3; // Optional: Description of the VM
  map<string, string> metadata = 4; // Optional: Metadata for the VM
}

message ImportOVAResponse {
  string vm_id = 1; // ID of the imported VM
  string message = 2; // Status message
  Error error = 3; // Error information, if any
}

// =============================================================================
// Extended VM Operations Messages (from v1)
// =============================================================================

message GetVMGuestIPsRequest {
  string vm_id = 1;
}

message GetVMGuestIPsResponse {
  repeated InterfaceAddress addresses = 1;
}

message InterfaceAddress {
  string mac = 1;
  repeated string ip = 2;
}

message ChangeVMUserPasswordRequest {
  string vm_id = 1;
  string username = 2;
  string password = 3;
}

message ChangeVMUserPasswordResponse {
  Error error = 1;
}

message AttachCloudInitRequest {
  string vm_id = 1;
  bytes cloud_init_iso = 2;
}

message AttachCloudInitResponse {
  Error error = 1;
}

message AttachNetworkInterfaceRequest {
  string vm_id = 1;
  string network_name = 2;
  optional string mac_address = 3;
  map<string, string> options = 4;
}

message AttachNetworkInterfaceResponse {
  bool success = 1;
  Error error = 2;
}

message DetachNetworkInterfaceRequest {
  string vm_id = 1;
  string mac_address = 2;
}

message DetachNetworkInterfaceResponse {
  bool success = 1;
  Error error = 2;
}

// =============================================================================
// Stream Protocol Messages
// =============================================================================

message StreamRequest {
  oneof message {
    OpenStreamMessage open = 1;
    bytes payload = 2;
    CloseStreamMessage close = 3;
  }
}

message OpenStreamMessage {
  string resource = 1;
  string resource_variant = 2;
}

message CloseStreamMessage {}

message StreamResponse {
  oneof message {
    bytes payload = 1;
    CloseStreamMessage close = 2;
  }
}

// =============================================================================
// Hardware Monitoring Messages
// =============================================================================

message GetHardwareHealthRequest {}

message GetHardwareHealthResponse {
  string overall_status = 1;
  repeated SensorData sensors = 2;
  string firmware_version = 3;
  string power_status = 4;
  Error error = 5;
}

message GetSensorDataRequest {
  optional string sensor_name = 1;
}

message GetSensorDataResponse {
  repeated SensorData sensors = 1;
  Error error = 2;
}

message SensorData {
  string name = 1;
  double value = 2;
  string unit = 3;
  string status = 4;
  string sensor_type = 5;
}

// =============================================================================
// VM Definition/Control Messages (low-level libvirt operations)
// =============================================================================

enum ControlCommand {
  CONTROL_COMMAND_UNSPECIFIED = 0;
  CONTROL_COMMAND_STOP = 1;
  CONTROL_COMMAND_KILL = 2;
  CONTROL_COMMAND_SUSPEND = 3;
  CONTROL_COMMAND_RESUME = 4;
  CONTROL_COMMAND_REBOOT = 5;
  CONTROL_COMMAND_SHUTDOWN = 6;
  CONTROL_COMMAND_RESET = 7;
}

message DefineVMRequest {
  string vm_definition = 1;
  optional bool boot_on_create = 2;
}

message DefineVMResponse {
  bool success = 1;
  string message = 2;
  Error error = 3;
  string vm_uuid = 4;
}

message GetVMDefinitionRequest {
  string vm_id = 1;
  bool force_fetch = 2;
}

message GetVMDefinitionResponse {
  string vm_definition = 1;
}

message ControlVMRequest {
  string vm_id = 1;
  ControlCommand command = 2;
}

message ControlVMResponse {
  bool success = 1;
  string message = 2;
  Error error = 3;
}

message GetVMStatusRequest {
  string vm_id = 1;
}

message GetVMStatusResponse {
  string status = 1;
}

message GetVMGuestInfoRequest {
  string vm_id = 1;
}

message VmGuestOS {
  string id = 1;
  string name = 2;
  string pretty_name = 3;
  string version = 4;
  string version_id = 5;
  string machine = 6;
  string kernel_release = 7;
  string kernel_version = 8;
}

message VmGuestInterfaceAddress {
  string type = 1;
  string address = 2;
  uint32 prefix = 3;
}

message VmGuestNetworkInterface {
  string name = 1;
  string hwaddr = 2;
  repeated VmGuestInterfaceAddress addresses = 3;
}

message GetVMGuestInfoResponse {
  string hostname = 1;
  VmGuestOS os = 2;
  repeated VmGuestNetworkInterface interfaces = 3;
}

// =============================================================================
// Power Scheduling Messages
// =============================================================================

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_REBOOT = 3;
}

enum RecurrenceType {
  RECURRENCE_TYPE_UNSPECIFIED = 0;
  RECURRENCE_TYPE_DAILY = 1;
  RECURRENCE_TYPE_WEEKLY = 2;
  RECURRENCE_TYPE_MONTHLY = 3;
}

message PowerSchedule {
  string id = 1;
  string vm_uuid = 2;
  PowerAction action = 3;
  RecurrenceType recurrence = 4;
  string cron_spec = 5;
  int32 day_of_week = 6;
  int32 day_of_month = 7;
  string time = 8;
  bool enabled = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreatePowerScheduleRequest {
  string vm_uuid = 1;
  PowerAction action = 2;
  RecurrenceType recurrence = 3;
  string cron_spec = 4;
  int32 day_of_week = 5;
  int32 day_of_month = 6;
  string time = 7;
  bool enabled = 8;
}

message CreatePowerScheduleResponse {
  bool success = 1;
  string schedule_id = 2;
  Error error = 3;
}

message ListPowerSchedulesRequest {
  string vm_uuid = 1;
  bool enabled_only = 2;
}

message ListPowerSchedulesResponse {
  repeated PowerSchedule schedules = 1;
  Error error = 2;
}

message UpdatePowerScheduleRequest {
  string schedule_id = 1;
  optional PowerAction action = 2;
  optional RecurrenceType recurrence = 3;
  optional string cron_spec = 4;
  optional int32 day_of_week = 5;
  optional int32 day_of_month = 6;
  optional string time = 7;
  optional bool enabled = 8;
}

message UpdatePowerScheduleResponse {
  bool success = 1;
  Error error = 2;
}

message DeletePowerScheduleRequest {
  string schedule_id = 1;
}

message DeletePowerScheduleResponse {
  bool success = 1;
  Error error = 2;
}

// =============================================================================
// Wake-on-LAN Messages
// =============================================================================

message WakeOnLANRequest {
  string vm_id = 1;
  string mac_address = 2;
}

message WakeOnLANResponse {
  bool success = 1;
  string message = 2;
  Error error = 3;
}