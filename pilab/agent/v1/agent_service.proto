// =============================================================================
// DEPRECATED: Agent Service v1 - Core VM Operations on Hypervisor Nodes
// =============================================================================
// Purpose: Provides VM-centric operations that run on agent/hypervisor nodes.
// These are the "local" operations that interact directly with libvirt/qemu.
//
// DEPRECATED: All features have been migrated to agent/v2/agent_service.proto
// - Migration: VmMigrate -> agent/v2/InitiateMigration
// - IP retrieval: VmIpList -> agent/v2/GetVMGuestIPs
// - Password change: VmChangeUserPassword -> agent/v2/ChangeVMUserPassword
// - Backup/Restore: VmBackupSystemVolume, VmRestoreSystemVolume -> Not yet in v2
// - Cloud-init: VmAttachCloudInit -> agent/v2/AttachCloudInit
// - Network interfaces: VmAttachNetworkInterface, VmDetachNetworkInterface -> agent/v2
// - Streaming: Stream -> agent/v2/Stream
// - Hardware: GetHardwareHealth, GetSensorData -> agent/v2
//
// Communication: Primarily unary RPC (some streaming for VNC/terminal)
//
// Key Operations (deprecated):
// - VM migration between hosts (live or cold)
// - IP address retrieval via qemu-guest-agent
// - Password changes via qemu-guest-agent
// - System volume backup/restore
// - Cloud-init ISO attachment
// - Network interface attach/detach
// - VNC/terminal streaming (bidirectional)
// - Hardware health monitoring
// =============================================================================

syntax = "proto3";

package pilab.agent.v1;

import "pilab/agent/v1/stream.proto";
import "pilab/agent/v1/error.proto";

option go_package = "go.pilab.hu/cloud/virtpb/pilab/agent/v1;agentv1";

// ----------------------------------------------------------------------------
// Main Agent Service Definition
// ----------------------------------------------------------------------------

service AgentService {
  // VmMigrate initiates a migration of a virtual machine.
  rpc VmMigrate(VmMigrateRequest) returns (VmMigrateResponse);
  // VmIpList returns a list of IP addresses of a virtual machine.
  rpc VmIpList(VmIpListRequest) returns (VmIpListResponse);
  // VmChangeUserPassword changes the password of a virtual machine.
  rpc VmChangeUserPassword(VmChangeUserPasswordRequest) returns (VmChangeUserPasswordResponse);

  // VmBackupSystemVolume backs up the system volume of a virtual machine.
  rpc VmBackupSystemVolume(VmBackupSystemVolumeRequest) returns (VmBackupSystemVolumeResponse);
  // VmRestoreSystemVolume restores the system volume of a virtual machine.
  rpc VmRestoreSystemVolume(VmRestoreSystemVolumeRequest) returns (VmRestoreSystemVolumeResponse);

  // VmAttachCloudInit attaches a cloud-init ISO to a virtual machine.
  rpc VmAttachCloudInit(VmAttachCloudInitRequest) returns (VmAttachCloudInitResponse);

  // Attach/Detach Network Interfaces
  rpc VmAttachNetworkInterface(VmAttachNetworkInterfaceRequest) returns (VmAttachNetworkInterfaceResponse);
  rpc VmDetachNetworkInterface(VmDetachNetworkInterfaceRequest) returns (VmDetachNetworkInterfaceResponse);

  // Stream provides a stream to a ReadWriteCloser. Used for VNC, Pseudo Terminal
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);

  // UpdateConfig updates the configuration of an appliance, covering the network, storage, etc.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // Hardware monitoring
  rpc GetHardwareHealth(GetHardwareHealthRequest) returns (GetHardwareHealthResponse);
  rpc GetSensorData(GetSensorDataRequest) returns (GetSensorDataResponse);

  // Control plane
  rpc Control(ControlRequest) returns (ControlResponse);
  // Status plane
  rpc Status(StatusRequest) returns (StatusResponse);
}



message StatusRequest {
  string vm = 1;
}

message StatusResponse {
  string status = 1;
}


message ControlRequest {
  enum ControlCommand {
    CONTROL_COMMAND_START = 0;
    CONTROL_COMMAND_STOP = 1;
    CONTROL_COMMAND_RESTART = 2;
    CONTROL_COMMAND_PAUSE = 3;
    CONTROL_COMMAND_RESUME = 4;
    CONTROL_COMMAND_MIGRATE = 5;
    CONTROL_COMMAND_KILL = 6;
    CONTROL_COMMAND_SUSPEND = 7;
    CONTROL_COMMAND_REBOOT = 8;
    CONTROL_COMMAND_SHUTDOWN = 9;
    CONTROL_COMMAND_RESET = 10;
  }

  ControlCommand command = 1;
  string vm = 2;
}

message ControlResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}


// ----------------------------------------------------------------------------
// Agent Service (Core VM Management)
// ----------------------------------------------------------------------------


message VmAttachCloudInitRequest {
  string vm = 1;
  bytes cloud_init_iso = 2;
}

message VmAttachCloudInitResponse {}


// MigrationRequest is the request message for CloudHostService.VmMigrateRequest
message VmMigrateRequest {
  // VmUuid is the machine's UUID.
  string vm = 1;
  // Destination is the destination of the migration (hostname or IP).
  string destination = 2;
  // Perform a live migration if possible.
  bool live = 3;
  // Optional: Parameters for live migration (e.g., auto-converge, compression).
  map<string, string> live_migration_options = 4;
}

// VmMigrateResponse is the response message for CloudHostService.VmMigrateRequest
message VmMigrateResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
  // You might include a migration ID for tracking.
}

message VmIpListRequest {
  string vm_uuid = 1;
}

message InterfaceAddress {
  string mac = 1;
  repeated string ip = 2;
}

message VmIpListResponse {
  repeated InterfaceAddress addresses = 1;
}

message VmChangeUserPasswordRequest {
  string vm = 1;
  string username = 2;
  string password = 3;
}

message VmChangeUserPasswordResponse {}

message VmBackupSystemVolumeRequest {
  string vm = 1;
}

message VmBackupSystemVolumeResponse {
  string volume_path = 1;
}

message VmRestoreSystemVolumeRequest {
  string vm = 1;
  string backup_path = 2;
}

message VmRestoreSystemVolumeResponse {}


message UpdateConfigRequest {
  string config = 1;
}

message UpdateConfigResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}

// Hardware monitoring messages
message GetHardwareHealthRequest {}

message GetHardwareHealthResponse {
  string overall_status = 1;
  repeated SensorData sensors = 2;
  string firmware_version = 3;
  string power_status = 4;
  optional ErrorResponse error = 5;
}

message GetSensorDataRequest {
  optional string sensor_name = 1; // Optional: filter by sensor name
}

message GetSensorDataResponse {
  repeated SensorData sensors = 1;
  optional ErrorResponse error = 2;
}

message SensorData {
  string name = 1;
  double value = 2;
  string unit = 3;
  string status = 4;
  string sensor_type = 5;
}

message VmAttachNetworkInterfaceRequest {
  string vm = 1;
  string network_name = 2; // Name of the libvirt network or OVS bridge
  optional string mac_address = 3;
  // Options like virtualport type, model, etc.
  map<string, string> options = 4;
}

message VmAttachNetworkInterfaceResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}

message VmDetachNetworkInterfaceRequest {
  string vm = 1;
  string mac_address = 2; // Identify the interface to detach
}

message VmDetachNetworkInterfaceResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}
