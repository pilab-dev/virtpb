// =============================================================================
// DEPRECATED: Virtual Machine Service - VM Lifecycle and State Management
// =============================================================================
// Purpose: Complete VM lifecycle management including definition, control,
// status monitoring, and power scheduling.
//
// DEPRECATED: All features have been migrated to agent/v2/agent_service.proto
// - Define: -> agent/v2/DefineVM
// - Control: -> agent/v2/ControlVM
// - Status: -> agent/v2/GetVMStatus
// - GuestInfo: -> agent/v2/GetVMGuestInfo
// - ISO: -> agent/v2/AttachIso/DetachIso
// - CreateVM: -> agent/v2/CreateVM
// - StartVM: -> agent/v2/StartVM
// - UpdateVM: -> agent/v2/UpdateVM
// - WakeOnLAN: -> agent/v2/WakeOnLAN
// - Power scheduling: -> agent/v2/CreatePowerSchedule, ListPowerSchedules, etc.
//
// Communication: Unary RPC for all operations
// =============================================================================

syntax = "proto3";

package pilab.cloud.agent.v1;

import "pilab/agent/v1/stream.proto";
import "pilab/agent/v1/error.proto";

option go_package = "go.pilab.hu/cloud/virtpb/agent/v1;agentv1";

// ControlCommand defines the commands that can be sent to control a virtual machine.
enum ControlCommand {
  CONTROL_COMMAND_UNSPECIFIED = 0;
  CONTROL_COMMAND_STOP = 1;
  CONTROL_COMMAND_KILL = 2;
  CONTROL_COMMAND_SUSPEND = 3;
  CONTROL_COMMAND_RESUME = 4;
  CONTROL_COMMAND_REBOOT = 5;
  CONTROL_COMMAND_SHUTDOWN = 6;
  CONTROL_COMMAND_RESET = 7;
}

service VirtualMachineService {
  rpc Define(VmDefineRequest) returns (VmDefineResponse);
  // GetDefinition fetches the definition of a virtual machine.
  rpc GetDefinition(VmGetDefinitionRequest) returns (VmGetDefinitionResponse);
  // Control controls the state of a virtual machine.
  rpc Control(VmControlRequest) returns (VmControlResponse);
  // Status retrieves the status of a virtual machine.
  rpc Status(VmStatusRequest) returns (VmStatusResponse);
  // GuestInfo sends a guest agent command to the client to fetch the guest agent data.
  rpc GuestInfo(VmGuestInfoRequest) returns (VmGuestInfoResponse);
  
  // AttachISO attaches an ISO to a virtual machine.
  rpc AttachISO(VmAttachISORequest) returns (VmAttachISOResponse);
  // DetachISO detaches an ISO from a virtual machine.
  rpc DetachISO(VmDetachISORequest) returns (VmDetachISOResponse);

  // Explicit VM Lifecycle Management (Alternative/Complementary to Define/Control)
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc WakeOnLAN(WakeOnLANRequest) returns (WakeOnLANResponse);
  // Note: Stop, Reboot, etc. can still use the Control RPC with appropriate commands.

  // Scheduled Power Operations
  rpc CreatePowerSchedule(CreatePowerScheduleRequest) returns (CreatePowerScheduleResponse);
  rpc ListPowerSchedules(ListPowerSchedulesRequest) returns (ListPowerSchedulesResponse);
  rpc UpdatePowerSchedule(UpdatePowerScheduleRequest) returns (UpdatePowerScheduleResponse);
  rpc DeletePowerSchedule(DeletePowerScheduleRequest) returns (DeletePowerScheduleResponse);
}

message VmDefineRequest {
  // VmDefinition is a [vms.VirtualMachine] object in JSON format.
  // it is used on orphan node fetching and existing VM importing.
  string vm_definition = 1;
  
  // If true, the hypervisor will start the machine after definition.
  optional bool boon_on_create = 2;
}

message VmDefineResponse {
  // success indicates whether the operation was successful.
  bool success = 1;
  // message contains additional information about the operation.
  string message = 2;
  // error contains an optional error response if the operation failed.
  optional ErrorResponse error = 3;

  // The vm_uuid is the UUID of the defined virtual machine.
  string vm_uuid = 4;
}

// VmGetDefinitionRequest request object for fetching VM definition from the hypervisor.
message VmGetDefinitionRequest {
  // VmUuid is the UUID of the virtual machine.
  string vm = 1;
  // If true, the definition will be fetched from the hypervisor.
  // If false, it will be fetched from the local cache.
  bool force_fetch = 2;
}

message VmGetDefinitionResponse {
  // VmDefinition is a [vms.VirtualMachine] object in JSON format.
  // it is used on orphan node fetching and existing VM importing.
  string vm_definition = 1;
}

// VmControlRequest is the request to control a virtual machine state.
message VmControlRequest {
  // The virtual machine's uuid.
  string vm = 1;
  // The command to execute on the virtual machine.
  ControlCommand command = 2;
}

// VmControlResponse is the response of the VmControlRequest.
message VmControlResponse {
  // success indicates whether the operation was successful.
  bool success = 1;
  // message contains additional information about the operation.
  string message = 2;
  // error contains an optional error response if the operation failed.
  optional ErrorResponse error = 3;
}

message VmAttachISORequest {
  string vm = 1;
  string iso_name = 2;
}

message VmAttachISOResponse {}

message VmDetachISORequest {
  string vm = 1;
  // IsoName required to exactly know which CDROM should be targeted.
  string iso_name = 2;
}

message VmDetachISOResponse {}

// VmStatusRequest is the request message for CloudHostService.VmStatus
message VmStatusRequest {
  string vm = 1;
}

// VmStatusResponse is the response message for CloudHostService.VmStatus
message VmStatusResponse {
  // Status is the status of the virtual machine (e.g., running, paused, stopped).
  string status = 1;
}



// ----------------------------------------------------------------------------
// Explicit VM Management Messages (Alternative/Complementary)
// ----------------------------------------------------------------------------

// Basic representation of a Virtual Machine for explicit operations.
// This might be simplified compared to the full definition used in VmDefineRequest.
message Disk {
  string path = 1;
  string device = 2;
  string bus = 3;
  string format = 4;
  // Storage QoS parameters
  int32 read_iops_sec = 5;
  int32 write_iops_sec = 6;
  int64 read_bytes_sec = 7;
  int64 write_bytes_sec = 8;
  int32 total_iops_sec = 9;
  int64 total_bytes_sec = 10;
  int32 burst_iops_sec = 11;
  int64 burst_bytes_sec = 12;
}

message Firmware {
  string type = 1; // e.g., "bios", "uefi"
  bool secure_boot = 2;
  bool enrolled_keys = 3;
}

message TPM {
  string model = 1; // e.g., "tpm-tis", "tpm-crb"
  string backend = 2; // e.g., "emulator", "passthrough"
  string device = 3; // for passthrough backend
}

message USBController {
  string model = 1; // e.g., "nec-xhci" (USB 3.0), "ehci" (USB 2.0), "qusb1" (USB 1.1), "qusb2" (USB 2.0)
  bool host_device_passthrough = 2; // Enable host device passthrough
  repeated string passthrough_devices = 3; // List of host USB devices to passthrough
}

message USBDevice {
  string vendor_id = 1; // USB vendor ID (e.g., "0x0781" for SanDisk)
  string product_id = 2; // USB product ID
  string host_bus = 3; // Host bus number
  string host_device = 4; // Host device number
}

message VMNetworkInterface {
  string type = 1; // e.g., "bridge", "network"
  string source = 2; // bridge name or network name
  string model = 3; // e.g., "virtio", "e1000"
  string mac = 4; // MAC address
  // For bonding/teaming
  repeated string bond_interfaces = 5; // interfaces to bond
  string bond_mode = 6; // e.g., "active-backup", "balance-rr", "lacp"
  bool lacp_enabled = 7;
  // Wake-on-LAN support
  bool wake_on_lan = 8; // Enable Wake-on-LAN for this interface
}

message VirtualMachine {
  string uuid = 1;
  string name = 2;
  // Add other core VM properties needed for creation/update
  int32 memory_mb = 3;
  int32 vcpus = 4;
  // Add fields for disks, network interfaces, etc. if needed for explicit creation/update
  repeated Disk disks = 5;
  Firmware firmware = 6;
  TPM tpm = 7;
  repeated VMNetworkInterface network_interfaces = 8;
  repeated USBController usb_controllers = 9;
  repeated USBDevice usb_devices = 10; // USB devices to attach to the VM
}

message CreateVMRequest {
  // Details to create the new virtual machine.
  // This could be a structured message or a definition string,
  // depending on the desired level of detail and flexibility.
  // Using a structured message is generally preferred for type safety.
  VirtualMachine vm_config = 1;
  // Optional: If true, the hypervisor will start the machine after creation.
  optional bool boot_on_create = 2;
}

message CreateVMResponse {
  // success indicates whether the operation was successful.
  bool success = 1;
  // message contains additional information about the operation.
  string message = 2;
  // error contains an optional error response if the operation failed.
  optional ErrorResponse error = 3;
  // The vm_uuid is the UUID of the created virtual machine.
  string vm_uuid = 4;
}

message StartVMRequest {
  // The virtual machine's uuid to start.
  string vm_uuid = 1;
}

message StartVMResponse {
  // No additional response needed for StartVM
}

message WakeOnLANRequest {
  string vm_uuid = 1; // UUID of the VM to wake up
  string mac_address = 2; // MAC address to send magic packet to (optional, can be retrieved from VM config)
}

message WakeOnLANResponse {
  bool success = 1;
  string message = 2;
  optional ErrorResponse error = 3;
}

message UpdateVMRequest {
  // The virtual machine's uuid to update.
  string vm_uuid = 1;
  // The updated virtual machine configuration.
  // Only fields present and non-default in this message should be updated.
  // Consider using field masks for partial updates in a real-world scenario.
  VirtualMachine updated_vm_config = 2;
}

message UpdateVMResponse {
  // success indicates whether the operation was successful.
  bool success = 1;
  // message contains additional information about the operation.
  string message = 2;
  // error contains an optional error response if the operation failed.
  optional ErrorResponse error = 3;
}


// ----------------------------------------------------------------------------
// Explicit VM Guest Information Messages
// ----------------------------------------------------------------------------

// VmGuestInfoRequest requests the guest info from the client.
message VmGuestInfoRequest {
  string vm = 1;
}

// VmGuestOS the OS information from the guest.
message VmGuestOS {
  string id = 1;
  string name = 2;
  string pretty_name = 3;
  string version = 4;
  string version_id = 5;
  string machine = 6;
  string kernel_release = 7;
  string kernel_version = 8;
}

// VmGuestInterfaceAddress network interface address.
message VmGuestInterfaceAddress {
  string type = 1;
  string address = 2;
  uint32 prefix = 3;
}

// VmGuestNetworkInterface guest network interface object.
message VmGuestNetworkInterface {
  string name = 1;
  string hwaddr = 2;
  repeated VmGuestInterfaceAddress addresses = 3;
}

// VmGuestInfoResponse response object containing the guest info.
message VmGuestInfoResponse {
  string hostname = 1;
  VmGuestOS os = 2;
  repeated VmGuestNetworkInterface interfaces = 3;
}

// ----------------------------------------------------------------------------
// Scheduled Power Operations
// ----------------------------------------------------------------------------

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_REBOOT = 3;
}

enum RecurrenceType {
  RECURRENCE_TYPE_UNSPECIFIED = 0;
  RECURRENCE_TYPE_DAILY = 1;
  RECURRENCE_TYPE_WEEKLY = 2;
  RECURRENCE_TYPE_MONTHLY = 3;
}

message PowerSchedule {
  string id = 1;
  string vm_uuid = 2;
  PowerAction action = 3;
  RecurrenceType recurrence = 4;
  string cron_spec = 5; // Cron expression for scheduling
  int32 day_of_week = 6; // 0-6 for weekly (Sunday=0), or day of month for monthly
  int32 day_of_month = 7; // 1-31 for monthly recurrence
  string time = 8; // Time of day in HH:MM format (local timezone)
  bool enabled = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreatePowerScheduleRequest {
  string vm_uuid = 1;
  PowerAction action = 2;
  RecurrenceType recurrence = 3;
  string cron_spec = 4; // Optional: direct cron expression
  int32 day_of_week = 5; // For weekly recurrence
  int32 day_of_month = 6; // For monthly recurrence
  string time = 7; // Required: HH:MM format
  bool enabled = 8;
}

message CreatePowerScheduleResponse {
  bool success = 1;
  string schedule_id = 2;
  optional ErrorResponse error = 3;
}

message ListPowerSchedulesRequest {
  string vm_uuid = 1; // Optional: filter by VM
  bool enabled_only = 2;
}

message ListPowerSchedulesResponse {
  repeated PowerSchedule schedules = 1;
  optional ErrorResponse error = 2;
}

message UpdatePowerScheduleRequest {
  string schedule_id = 1;
  optional PowerAction action = 2;
  optional RecurrenceType recurrence = 3;
  optional string cron_spec = 4;
  optional int32 day_of_week = 5;
  optional int32 day_of_month = 6;
  optional string time = 7;
  optional bool enabled = 8;
}

message UpdatePowerScheduleResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}

message DeletePowerScheduleRequest {
  string schedule_id = 1;
}

message DeletePowerScheduleResponse {
  bool success = 1;
  optional ErrorResponse error = 2;
}