// =============================================================================
// Snapshot Service - VM Snapshot Management
// =============================================================================
// Purpose: Manages VM snapshots including create, restore, delete, clone,
// and consolidation. Streaming response for snapshot creation (progress).
//
// Communication: Unary RPC (Create uses streaming for progress)
//
// Snapshot Types:
// - Disk snapshot: Point-in-time copy of disk state
// - Memory snapshot: Includes runtime state (RAM)
//
// Operations:
// - Create: Creates new snapshot (optionally with memory state)
// - Restore: Reverts VM to snapshot state
// - Delete: Removes snapshot
// - Clone: Creates new VM from snapshot
// - Consolidate: Merges snapshot into parent disk (for performance)
// - List: Returns all snapshots for a VM
// =============================================================================

syntax = "proto3";

package pilab.cloud.agent.v1;

import "pilab/agent/v1/stream.proto";

option go_package = "go.pilab.hu/cloud/virtpb/agent/v1;agentv1";

service SnapshotService {
  // Create creates a snapshot of a virtual machine.
  rpc Create(SnapshotCreateRequest) returns (stream SnapshotCreateResponse);
  // Restore restores a virtual machine from a snapshot.
  rpc Restore(SnapshotRestoreRequest) returns (SnapshotRestoreResponse);
  // Delete deletes a snapshot of a virtual machine.
  rpc Delete(SnapshotDeleteRequest) returns (SnapshotDeleteResponse);
  // Clone clones a virtual machine from a snapshot.
  rpc Clone(SnapshotCloneRequest) returns (SnapshotCloneResponse);
  // Consolidate merges a snapshot into its parent disk.
  rpc Consolidate(SnapshotConsolidateRequest) returns (SnapshotConsolidateResponse);
  // List returns all snapshots for a VM.
  rpc List(SnapshotListRequest) returns (SnapshotListResponse);
}

message SnapshotConsolidateRequest {
  string vm = 1;
  string snapshot_name = 2;
}

message SnapshotConsolidateResponse {}

message SnapshotListRequest {
  string vm = 1;
}

message SnapshotInfo {
  string name = 1;
  string description = 2;
  bool memory_snapshot = 3;
  int64 creation_time = 4;
  string parent_name = 5;
}

message SnapshotListResponse {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotRestoreRequest {
  string vm = 1;
  string snapshot_name = 4;
}

message SnapshotRestoreResponse {}

message SnapshotCreateRequest {
  string vm = 1;
  string snapshot_name = 4;
  bool include_memory = 5;
  string description = 6;
}

message SnapshotCreateResponse {
  string snapshot_id = 1;
  int64 created_at = 2;
}

message SnapshotDeleteRequest {
  string vm = 1;
  string snapshot_name = 4;
}

message SnapshotDeleteResponse {}

message SnapshotCloneRequest {
  string vm = 1;
  string snapshot_name = 3;
  string new_vm_name = 4;
  // TODO: add more fields for customization of the cloned VM.
}

message SnapshotCloneResponse {
    // TODO: add fields for the cloned VM response, for example a task id, or sg.
}